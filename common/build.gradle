plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}


// Game tests are written here so they can run on every loader. This source set is compiled against the vanilla game only,
// exactly like the main one, which keeps the tests free of loader specific code. Anything a test needs from a loader goes
// through GameTestServices, mirroring the platform services the main source set uses.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestAnnotationProcessor.extendsFrom annotationProcessor
    commonGametestJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonGametestResources {
        canBeResolved = false
        canBeConsumed = true
    }
    // The compiled classes of this source set. The loader projects put them on their game test compile classpath purely so
    // the IDE can resolve them, because it has no way to model sources handed straight to a compile task.
    commonGametestClasses {
        canBeResolved = false
        canBeConsumed = true
    }
}

// The loader projects consume these as source directories, the same way they consume the main sources.
artifacts {
    commonGametestJava sourceSets.gametest.java.sourceDirectories.singleFile
    commonGametestResources sourceSets.gametest.resources.sourceDirectories.singleFile
    commonGametestClasses(sourceSets.gametest.java.classesDirectory) {
        builtBy tasks.named('gametestClasses')
    }
}
