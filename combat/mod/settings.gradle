pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'mod'
// The whole Gradle build lives in combat/mod, one folder per loader plus the common code, so the combat subproject's
// root holds nothing but its own top level folders. The trainer, scripts and training runs sit beside this folder, not
// inside it, and the repository root above combat/ holds mind/, shared/ and the files common to both halves.
['common', 'fabric', 'neoforge'].each { name ->
    include(name)
}
