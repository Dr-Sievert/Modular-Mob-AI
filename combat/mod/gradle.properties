# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=1.0.0
group=net.sievert.modularmobai
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Modular Mob AI
mod_author=Dr.Sievert
mod_id=modular_mob_ai
license=CC0-1.0
credits=
description=A neural-network brain for Minecraft mobs. The agent is a player-shaped mob driven every tick by a small \nnetwork that runs inside the game, trained offline by reinforcement learning. It fights with swords, axes, bows, \ncrossbows and shields, and mines and places blocks, under a player's rules.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx4G
# Kept alive between builds: every script is a build, and a fresh one spends seconds starting a JVM and configuring both
# loaders before doing anything. Idle for half an hour, it goes away and gives its memory back to the game workers.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=1800000

# Game tests
## How many arenas the game test suite runs. This is the authoritative number and the only place it lives: the build
## has to know it before any test is compiled, so that a parallel run can size its workers for the run it is about to
## start rather than for the one before it. Override for a single run with -Parenas=N.
arenas=10000
