plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

// The forward pass has a second set of loops written in explicit vector instructions, which need the incubator module to
// compile against: brain/nn/ForwardVectors.java, worth about 15% of the pass. Java 21 warns that the module is incubating,
// which is the whole point of the guard on the other side: Forward looks the class up by name at load time and keeps its
// plain loops when the module is not there, so a jar dropped into a game started without this flag still runs, only
// slower. The flag is added wherever this build compiles and wherever it starts a game, and nowhere else.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('-add-modules', 'jdk.incubator.vector')
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// Declare capabilities on the outgoing configurations, which is what lets the three projects of one mod be told apart by
// anything consuming them.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
}

// The licence sits at the repository root, which since the monorepo move is two levels above this build:
// the build is combat/mod, and LICENSE stays at the top beside combat/ and mind/.
sourcesJar {
    from(rootProject.file('../../LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('../../LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

// Configures processResources and processGametestResources alike, so both source sets expand the same placeholders.
tasks.withType(ProcessResources).configureEach {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

// Game tests live in their own 'gametest' source set which is only ever loaded by a development run, never by the jar that
// ships. The processed metadata therefore always points at the game test entry point and mixin config, so every run has
// them, and they are stripped again while the jar is packaged so a published jar never declares classes it does not
// contain. Doing it here rather than from a flag is what makes a run started from the IDE behave like a Gradle one: the
// IDE never invokes a game test task, so nothing about the run itself is there to detect.
jar {
    // Only the lines naming the game test hooks are dropped, which leaves an empty 'fabric-gametest' entry point list and
    // a mixin list without the game test config. The game test mixin config is listed first in fabric.mod.json for that
    // reason: dropping any other entry of that array would leave a trailing comma behind. fabric.mod.json has to stay
    // valid JSON on disk because Loom reads it during configuration, which is why it carries the real entries at all.
    filesMatching(['fabric.mod.json']) {
        filter { String line -> line.contains('.gametest.') ? null : line }
    }

    // A mixin config in a .toml spans a table header and its key, so neither line can be recognised by its content alone
    // and both carry a trailing #gametest marker instead.
    filesMatching(['META-INF/neoforge.mods.toml']) {
        filter { String line -> line.trim().endsWith('#gametest') ? null : line }
    }
}
