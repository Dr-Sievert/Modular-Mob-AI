pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'Modular-Mob-AI'
// Everything Minecraft related lives under a single folder, so the root stays free for the rest of the project.
// The project paths stay flat, so a subproject is still :common, :fabric or :neoforge no matter where its files sit.
['common', 'fabric', 'neoforge'].each { name ->
    include(name)
    project(":$name").projectDir = file("minecraft/$name")
}
