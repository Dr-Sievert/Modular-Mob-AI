plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Game test wiring. The client and server runs also load the game test source set so the tests can be driven by hand with
// '/test runall' in a normal dev world, while runGameTestServer boots a headless server that runs them all and exits. The
// enabledGameTestNamespaces property every run needs is already set by the configureEach block above.
neoForge {
    runs {
        client {
            sourceSet = sourceSets.gametest
        }
        server {
            sourceSet = sourceSets.gametest
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest

            // How many cores the server may see, when asked; every core otherwise. The parallel runs set their own.
            def cpus = providers.gradleProperty('workerCpus').getOrElse('')

            if (cpus.isInteger()) {

                jvmArgument "-XX:ActiveProcessorCount=${cpus}"
            }

            // Which fights: 'arena', the closed box on a flat world, or 'terrain', the open fight on natural ground.
            systemProperty 'modular_mob_ai.gametest.suite', providers.gradleProperty('suite').getOrElse('')

            // Per run overrides for the knobs on GameTestTuning, whose defaults are the fastest measured settings.
            systemProperty 'modular_mob_ai.gametest.batchSize', providers.gradleProperty('batchSize').getOrElse('')
            systemProperty 'modular_mob_ai.gametest.ticksPerSecond', providers.gradleProperty('ticksPerSecond').getOrElse('')
            systemProperty 'modular_mob_ai.gametest.reusePlots', providers.gradleProperty('reusePlots').getOrElse('')
            systemProperty 'modular_mob_ai.gametest.terrainSeed', providers.gradleProperty('terrainSeed').getOrElse('')

            // Name a file to write the per tick dataset; a relative path lands in the run directory.
            systemProperty 'modular_mob_ai.gametest.capture', providers.gradleProperty('capture').getOrElse('')

            // Overrides the arena count the test declares, without recompiling.
            systemProperty 'modular_mob_ai.gametest.arenas', providers.gradleProperty('arenas').getOrElse('')

            // Which brain drives the agents: scripted (the default) needs nothing, neural needs a weight file.
            systemProperty 'modular_mob_ai.brain', providers.gradleProperty('brain').getOrElse('')
            systemProperty 'modular_mob_ai.brain.weights', providers.gradleProperty('brainWeights').getOrElse('')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.gametest
        }
    }
}
