plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Game test wiring. The client and server runs also load the game test source set so the tests can be driven by hand with
// '/test runall' in a normal dev world, while runGametest boots a headless server that runs them all and exits.
loom {
    // Without this the loader treats the game test output directories as a separate mod and the test structures under
    // data/ are never added to the mod's resources. Declaring the source sets groups them into one mod on the classpath.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }

    runs {
        client {
            source(sourceSets.gametest)
        }
        server {
            source(sourceSets.gametest)
        }

        // Which brain drives the agents in a development game, and where networks are looked for by name: what
        // scripts\play.ps1 passes. Left out, a game runs on its config file, config/modular_mob_ai.properties.
        [client, server].each { run ->
            run.vmArg("-Dmodular_mob_ai.brain=${providers.gradleProperty('brain').getOrElse('')}")
            run.vmArg("-Dmodular_mob_ai.brain.weights=${providers.gradleProperty('brainWeights').getOrElse('')}")
            run.vmArg("-Dmodular_mob_ai.models=${providers.gradleProperty('models').getOrElse('')}")
        }

        // Straight into a saved world, by its folder under saves, skipping the menus: scripts\play.ps1 -World.
        def world = providers.gradleProperty('world').getOrElse('')

        if (!world.isEmpty()) {
            client.programArgs('--quickPlaySingleplayer', world)
        }

        gametest {
            server()
            setConfigName('Fabric Game Test')
            ideConfigGenerated(true)
            source(sourceSets.gametest)
            runDir('runs/gametest')
            vmArg('-Dfabric-api.gametest')

            // How many cores the server may see, when asked; every core otherwise. The parallel runs set their own.
            def cpus = providers.gradleProperty('workerCpus').getOrElse('')

            if (cpus.isInteger()) {

                vmArg("-XX:ActiveProcessorCount=${cpus}")
            }

            // Which fights: 'arena', the closed box on a flat world, or 'terrain', the open fight on natural ground.
            vmArg("-Dmodular_mob_ai.gametest.suite=${providers.gradleProperty('suite').getOrElse('')}")

            // Per run overrides for the knobs on GameTestTuning, whose defaults are the fastest measured settings.
            vmArg("-Dmodular_mob_ai.gametest.batchSize=${providers.gradleProperty('batchSize').getOrElse('')}")
            vmArg("-Dmodular_mob_ai.gametest.ticksPerSecond=${providers.gradleProperty('ticksPerSecond').getOrElse('')}")
            vmArg("-Dmodular_mob_ai.gametest.reusePlots=${providers.gradleProperty('reusePlots').getOrElse('')}")
            vmArg("-Dmodular_mob_ai.gametest.terrainSeed=${providers.gradleProperty('terrainSeed').getOrElse('')}")
            vmArg("-Dmodular_mob_ai.gametest.sites=${providers.gradleProperty('sites').getOrElse('')}")

            // Name a file to write the per tick dataset; a relative path lands in the run directory.
            vmArg("-Dmodular_mob_ai.gametest.capture=${providers.gradleProperty('capture').getOrElse('')}")

            // Overrides the arena count the test declares, without recompiling.
            vmArg("-Dmodular_mob_ai.gametest.arenas=${providers.gradleProperty('arenas').getOrElse('')}")

            // Which brain drives the agents: scripted (the default) needs nothing, neural needs a weight file.
            vmArg("-Dmodular_mob_ai.brain=${providers.gradleProperty('brain').getOrElse('')}")
            vmArg("-Dmodular_mob_ai.brain.weights=${providers.gradleProperty('brainWeights').getOrElse('')}")
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/report.xml")
        }
    }
}
