plugins {
    id 'multiloader-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// The trained networks published in the repository's models\ go into the mod's jar, so that a jar dropped into any game
// brings its fighters along and nothing has to point it at a file. Each models\<name>\best.mbw becomes
// modular_mob_ai/models/<name>.mbw, beside an index naming them all, the best of them by the win rate its model.json
// records, and a line on each. The mod finds them by name (see Models.java); 'best' is the one the index names, which is
// the same pick scripts\play.ps1 makes. Every network is taken, about 1.3 MB each; a model.json without a win rate, one
// published before it was evaluated, is carried but never the best while an evaluated one is there.
def bundleModels = tasks.register('bundleModels') {

    def source = new File(rootProject.projectDir.parentFile, 'models')
    def output = project.layout.buildDirectory.dir('generated/bundledModels')

    inputs.files(project.fileTree(source) { include '*/best.mbw', '*/model.json', '*/schema.json' }).withPropertyName('models')
    outputs.dir(output).withPropertyName('bundledModels')

    doLast {

        def folder = new File(output.get().asFile, "${project.property('mod_id')}/models")
        project.delete(folder)
        folder.mkdirs()

        def found = []

        (source.listFiles() ?: []).findAll { it.isDirectory() && new File(it, 'best.mbw').isFile() }.sort { it.name }.each { dir ->

            // Only what can be a name in a command, which is also all that can never climb out of the folder it is in.
            if (!(dir.name ==~ /[A-Za-z0-9_.\-]+/) || dir.name.startsWith('.')) {

                logger.warn("Not bundling ${dir.name}: a network's folder name may hold letters, digits, dots, dashes and underscores")
                return
            }

            java.nio.file.Files.copy(new File(dir, 'best.mbw').toPath(), new File(folder, "${dir.name}.mbw").toPath())

            def json = new File(dir, 'model.json')
            def info = json.isFile() ? new groovy.json.JsonSlurper().parse(json) : [:]
            def summary = info.won != null ? "iteration ${info.iteration}, won ${info.won}% of ${info.fights} fights" : (info.weights ?: 'not evaluated')

            // Which body it drives, out of the layout published beside it. A network belongs to one body, so `best` does
            // too: one global best would hand a beast's network to a humanoid on any day a beast evaluated higher, and the
            // only thing that would say so is the driver, mid fight. A folder published before this carries no schema.json,
            // and then nothing here knows its body: it stays loadable by name, where its own schema id decides, and is no
            // body's best.
            def layout = new File(dir, 'schema.json')
            def body = layout.isFile() ? (new groovy.json.JsonSlurper().parse(layout) as Map).species : null

            found << [name: dir.name, species: body, won: info.won != null ? (info.won as double) : null,
                      fights: (info.fights ?: 0) as int, summary: summary]
        }

        def index = new Properties()
        index.setProperty('models', found.collect { it.name }.join(','))
        found.each {
            index.setProperty("${it.name}.summary".toString(), it.summary as String)

            if (it.species) {

                index.setProperty("${it.name}.species".toString(), it.species as String)
            }
        }

        // The highest win rate of that body, and of equal ones the one judged on more fights.
        def bests = [:]

        found.findAll { it.species }.groupBy { it.species }.each { body, ofBody ->

            def evaluated = ofBody.findAll { it.won != null }
            def best = evaluated ? evaluated.max { a, b -> a.won <=> b.won ?: a.fights <=> b.fights } : ofBody.first()

            bests[body] = best.name
            index.setProperty("best.${body}".toString(), best.name as String)
        }

        new File(folder, 'models.properties').withWriter('UTF-8') { writer ->
            index.store(writer, 'The trained networks this jar carries, from the repository\'s models folder')
        }

        logger.lifecycle("Bundled ${found.size()} networks into the jar"
                + (bests ? ", best " + bests.collect { body, name -> "${name} (${body})" }.join(', ') : ''))
    }
}

processResources {
    from(bundleModels)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// The game test source set mirrors the main one: the loader project compiles the common project's game test sources
// alongside its own, so tests are written once in common and run on every loader. It is a development only source set, so
// nothing here reaches the published jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
    commonGametestJava {
        canBeResolved = true
    }
    commonGametestResources {
        canBeResolved = true
    }
}

dependencies {
    commonGametestJava project(path: ':common', configuration: 'commonGametestJava')
    commonGametestResources project(path: ':common', configuration: 'commonGametestResources')

    // The common game test sources are compiled into this project by adding them to compileGametestJava, which the IDE has
    // no way to model, so it cannot resolve anything declared in them. These two dependencies give it the compiled common
    // classes to resolve against instead, mirroring the compileOnly dependency the main source set already carries. Both
    // are compile only, so the classes this project builds from the shared sources stay the only copy at runtime.
    gametestCompileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    gametestCompileOnly project(path: ':common', configuration: 'commonGametestClasses')
}

tasks.named('compileGametestJava', JavaCompile) {
    dependsOn(configurations.commonGametestJava)
    source(configurations.commonGametestJava)
}

tasks.named('processGametestResources', ProcessResources) {
    dependsOn(configurations.commonGametestResources)
    from(configurations.commonGametestResources)
}

// Every mob's shape, out of the game and into viewer/models, so the replay viewer's 3D view can draw a polar bear as a
// polar bear instead of as a humanoid box in a polar bear's skin.
//
//   gradlew :fabric:exportMobModels
//
// Minecraft's entity models are data: a tree of cuboids with pivots, rotations and texture offsets, built by the client's
// model classes and nothing more. So this needs the client classes but no window and no graphics, which is why it is a
// plain JavaExec on the game test runtime classpath rather than a game; it runs in a few seconds. See
// gametest/tools/MobModelTool for what comes out.
//
// What it writes is committed. It is generated data derived from the game -- cuboid corners, sizes and texture offsets,
// the same kind of thing as a block's shape -- and not a Mojang asset: no texture and no image is written, and mob skins
// are still read at runtime from the user's own jar, never from the repository.
tasks.register('exportMobModels', JavaExec) {

    group = 'modular mob ai'
    description = 'Writes every mob\'s cuboid shape to viewer/models for the replay viewer'

    // This build lives in mod/; the viewer sits beside it at the repository root.
    def output = new File(new File(rootProject.projectDir.parentFile, 'viewer'), 'models')

    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = 'net.sievert.modularmobai.gametest.tools.MobModelTool'
    args 'models', output.absolutePath
    outputs.upToDateWhen { false }
}

// Runs the game test suite across several worker processes at once. The server ticks its tests on a single thread, so one
// process only ever uses one core no matter how many arenas are live in it; real parallelism has to come from running
// several servers side by side. Each worker is handed an interleaved slice of the arenas, its own game directory, and a
// file to write its durations to, and the results are combined back into one summary when they have all finished.
//
//   gradlew :neoforge:runGametestParallel
//   gradlew :fabric:runGametestParallel -Pworkers=8
afterEvaluate {

    def runTask = tasks.findByName('runGametest') ?: tasks.findByName('runGameTestServer')

    if (runTask == null) {

        return
    }

    // This build lives in mod/; the trainer, the scripts and the training runs sit beside it at the repository root.
    def repositoryRoot = rootProject.projectDir.parentFile

    // The forward pass's explicit vector loops, worth about 15% of the pass, need jdk.incubator.vector resolved: the
    // classes run from the class path, and the unnamed module only reads a module that something put in the root set. So
    // every game this build starts is started with it, client and server alike, and so is every worker runArenas starts,
    // which copies this task's virtual machine arguments. Anywhere it is missing, Forward keeps its plain loops and the
    // answers are the same to the bit; see brain/nn/ForwardVectors.java.
    tasks.withType(JavaExec).configureEach {

        jvmArgs '--add-modules', 'jdk.incubator.vector'
    }

    // A path given on the command line, taken from the repository root unless it is already absolute.
    def fromRepositoryRoot = { String path ->

        def file = new File(path)
        return file.isAbsolute() ? file : new File(repositoryRoot, path)
    }

    // Replays of fights, for watching afterwards: every Nth fight of each worker, written whole when it ends, in the format
    // docs/replay-format.md describes. Off unless -PreplayEvery=N asks, except in training, which keeps one fight in two
    // hundred unless told otherwise. A one-off run writes into runs/gametest/replays, or runs/<replayRun>/replays when given
    // a name, and says where at the end; a training run writes into its own folder. Nothing is ever cleared: each worker
    // numbers its fights on from the replays it already left there.
    def replayEvery = { int fallback -> Integer.parseInt(providers.gradleProperty('replayEvery').getOrElse(String.valueOf(fallback))) }

    def replayProperties = { String runName, int every ->

        def folder = new File(new File(new File(repositoryRoot, 'runs'), runName), 'replays')
        return ['modular_mob_ai.replays': every > 0 ? folder.absolutePath : '', 'modular_mob_ai.replays.every': Math.max(1, every)]
    }

    // The single process run takes these straight onto its command line, and every worker a parallel run starts copies
    // them from there.
    def oneOffReplays = replayProperties(providers.gradleProperty('replayRun').getOrElse('gametest'), replayEvery(0))

    oneOffReplays.each { name, value -> runTask.systemProperty(name, value) }

    def reportReplays = {

        if (!oneOffReplays['modular_mob_ai.replays'].isEmpty()) {

            println "Replays: ${oneOffReplays['modular_mob_ai.replays']}"
        }
    }

    runTask.doLast { reportReplays() }

    // Who the agents fight, for trying them against something other than a vindicator: -Popponent=minecraft:skeleton. Set
    // on the single process run like the replay properties, so every worker runArenas starts copies it from there.
    runTask.systemProperty('modular_mob_ai.gametest.opponent', providers.gradleProperty('opponent').getOrElse(''))

    // The league suite's opponents and loadouts, when a run wants fewer than all of them: -PleagueOpponents=zombie,creeper
    // or -PleagueOpponents=2x_zombie, -PleagueLoadouts=sword,bow. Names as the league writes them in its results. And which
    // rungs of the difficulty ladder a run with no trainer goes round, -PleagueDifficulties=easy,normal,hard; a training
    // run ignores it, since its trainer opens a rung when the agent has earned it.
    runTask.systemProperty('modular_mob_ai.league.opponents', providers.gradleProperty('leagueOpponents').getOrElse(''))
    runTask.systemProperty('modular_mob_ai.league.loadouts', providers.gradleProperty('leagueLoadouts').getOrElse(''))
    runTask.systemProperty('modular_mob_ai.league.difficulties', providers.gradleProperty('leagueDifficulties').getOrElse(''))

    // Published networks the league fields as rated players, by the name they are published under in models\:
    // -PleagueModels=blast, or several separated by commas. Nobody unless named. Each is a player like any other, so two runs that field the
    // same network have a tier list that can be read beside the other's; see gametest/league/Published.
    runTask.systemProperty('modular_mob_ai.league.models', providers.gradleProperty('leagueModels').getOrElse(''))

    // What share of league fights look for ground with something on it worth knocking an opponent into, lava or a cliff
    // edge: -PleagueHazards=0.25, and 0 for none at all. A quarter unless told otherwise; see League.
    runTask.systemProperty('modular_mob_ai.league.hazards', providers.gradleProperty('leagueHazards').getOrElse(''))

    // Whether a fight that asked for such ground and was handed flat ground gets a pool of lava poured beside it for that
    // fight, put back when it ends: -PpourHazards=false turns it off. On by default, because the overworld surface has
    // almost no lava and two per cent of fights is too rare to learn the best blow in the game from; see PouredHazards.
    runTask.systemProperty('modular_mob_ai.gametest.pourHazards', providers.gradleProperty('pourHazards').getOrElse(''))

    // Where the fight sites come from, as a seed: the same number puts every worker on the same ground, which is what
    // comparing two builds needs, because one round in a forest and the next in the mountains differ by more than most
    // changes do. Zero, the default, lets every worker pick somewhere new. Measured with it pinned, two rounds of 24,000
    // fights came out on the same sites with the same fights won to the unit, which is what makes a few percent readable
    // at all. See GameTestTuning.terrainSeed; on the terrain library it picks where in the library a worker starts.
    runTask.systemProperty('modular_mob_ai.gametest.terrainSeed', providers.gradleProperty('terrainSeed').getOrElse('0'))

    // The small tool that lives in the game test sources. It touches nothing of the game, so it runs as a plain Java
    // program in a second rather than booting a server: the observation layout the training side builds a network from,
    // and the parity check between this build's forward pass and PyTorch's.
    // Which body a run trains, and so which layout the training side is handed. One body has a trained network today, and
    // naming it here rather than letting the tool guess is what keeps a run from quietly training the wrong shape; see
    // brain/schema/Species.java and docs/species.md.
    def trainedSpecies = providers.gradleProperty('species').getOrElse('humanoid')

    // The same answer told to the game, so that anything asked to load a network for this run can say which body it has to
    // fit before it tries: the league refuses a published network of another body by name rather than letting the driver
    // find out in the middle of a fight. See gametest/league/Published and docs/species.md.
    runTask.systemProperty('modular_mob_ai.species', trainedSpecies)

    def brainTool = { List<String> toolArguments, boolean quiet = false ->

        def javaExe = runTask.javaLauncher.get().executablePath.asFile.absolutePath
        def classes = (sourceSets.gametest.output.files + sourceSets.main.output.files).collect { it.absolutePath }

        def command = [javaExe, '--add-modules', 'jdk.incubator.vector',
                       '-cp', classes.join(File.pathSeparator), 'net.sievert.modularmobai.gametest.tools.BrainTool']
        command += toolArguments

        def builder = new ProcessBuilder(command as String[])
        builder.directory(repositoryRoot)
        builder.redirectErrorStream(true)

        def tool = builder.start()
        def lines = []

        tool.inputStream.withReader('UTF-8') { reader ->

            reader.eachLine { line ->

                lines += line

                if (!quiet) {

                    logger.lifecycle("[brain] " + line)
                }
            }
        }

        def code = tool.waitFor()

        if (code != 0) {

            throw new GradleException("The brain tool failed: ${toolArguments.join(' ')}\n  " + lines.join("\n  "))
        }

        return lines
    }

    // Every body this build has, asked of the build rather than listed here, so that adding a species cannot leave the
    // parity check quietly going round the old set. The incubating module warning is not a body.
    def allSpecies = {

        return brainTool(['species'], true).findAll { it ==~ /^[a-z0-9_]+$/ }
    }

    // The layout the training side builds its network from, written into a run's folder straight out of the game's own
    // classes. Written every time, so a schema that changed is caught here rather than by a network reading the wrong slots.
    //
    // A run belongs to one body for its whole life, and -Pspecies is a flag that is easy to leave off the second command:
    // dagger.ps1 or a resumed train.ps1 without it would have quietly replaced a beast run's layout with the humanoid's,
    // and every shard and checkpoint the run already has would then have been refused one at a time by a message about two
    // hexadecimal numbers. So the body a run already has is read back and held to, by name, before anything is overwritten.
    def writeRunSchema = { File runDirectory ->

        def schema = new File(runDirectory, 'schema.json')

        if (schema.isFile()) {

            def already = (new groovy.json.JsonSlurper().parse(schema) as Map).species

            if (already && already != trainedSpecies) {

                throw new GradleException("${runDirectory.name} has been training a ${already} and this command is for a "
                        + "${trainedSpecies}. A run is one body's: pass -Pspecies=${already} (scripts: -Species ${already}), "
                        + "or start a run of its own for the ${trainedSpecies}. See docs/species.md.")
            }
        }

        brainTool(['schema', trainedSpecies, schema.absolutePath])
    }

    // Generating the terrain is most of what starting a worker on natural terrain costs, and a world generated once can be
    // fought in again. So every such worker's world is kept in runs/terrain/<minecraft version>, and later workers start
    // from one of those, reading their fight sites from disk instead of generating them: the least used first, each at
    // most terrainUses times. A world that has been used up is dropped, and while the pool is short of terrainPool
    // worlds, one worker of every run generates a fresh one, so the terrain keeps changing. A world is about 60 MB;
    // -PterrainPool=0 turns the pool off.
    def terrainPool = new File(new File(new File(repositoryRoot, 'runs'), 'terrain'), project.property('minecraft_version') as String)
    def terrainPoolSize = Integer.parseInt(providers.gradleProperty('terrainPool').getOrElse('8'))
    def terrainUses = Integer.parseInt(providers.gradleProperty('terrainUses').getOrElse('8'))

    // A property holding a whole command line -- -PtrainArgs, -PparityArgs -- split on whitespace, except that a wholly
    // quoted argument is taken as one and its quotes removed. A plain split on whitespace cannot carry a path at all: quote
    // it and the quotes arrive as part of the argument, leave it bare and a path with a space in it becomes two arguments.
    //
    // Not a shell: `--flag="a b"`, quotes mid-argument, and escaping are none of them handled. `--flag "a b"` is, which is
    // the form every caller here uses and the one that was broken.
    def splitArguments = { String text ->

        def tokens = []
        def matcher = (text =~ /"([^"]*)"|(\S+)/)

        while (matcher.find()) {

            tokens << (matcher.group(1) != null ? matcher.group(1) : matcher.group(2))
        }

        return tokens
    }

    // The checkout this one is a worktree of, or null when this is the checkout itself. A worktree's .git is a file saying
    // "gitdir: <main>/.git/worktrees/<name>", so the main checkout is two levels above that .git.
    //
    // What it is for is machine-wide things a worktree should never own a copy of, and never link to either: the trainer
    // environment is gigabytes of PyTorch and the terrain library is half an hour of generated ground. Both were linked in
    // by hand instead, and both were then destroyed by a recursive delete of the worktree that followed the link -- the
    // environment provably, the library on every piece of evidence but a witness. A borrowed path cannot be followed.
    def mainCheckout = {

        def dotGit = new File(repositoryRoot, '.git')

        if (!dotGit.isFile()) {

            return null
        }

        def line = dotGit.text.readLines().find { it.startsWith('gitdir:') }

        if (!line) {

            return null
        }

        def directory = new File(line.substring('gitdir:'.length()).trim()).absoluteFile

        while (directory != null && directory.name != '.git') {

            directory = directory.parentFile
        }

        return directory?.parentFile
    }

    def readProperties = { File file ->

        def properties = new Properties()

        if (file.isFile()) {

            file.withInputStream { properties.load(it) }
        }

        return properties
    }

    // Which logical processors a worker may run on, as a Windows affinity mask, or zero for "wherever it likes".
    //
    // A worker is bound by its one server thread, and on a chip with two kinds of core that thread is the single most
    // important thing about a run. Workers run at below normal priority, so that the desktop stays usable, and Windows
    // reads a below-normal thread as background work and parks it on an efficiency core. Measured on this i7-14700KF, the
    // same forward pass takes 9.4 us an agent tick on a performance core and 24.8 on an efficiency one, and a worker left
    // where Windows put it ran the pass at 29.4 us and 12,662 arena ticks a second of server thread; confined to the
    // performance cores it ran at 11.5 us and 26,476, and 6,000 fights took 34 seconds instead of 61. Raising the priority
    // to normal instead changed nothing at all, so the workers stay below normal and keep the desktop's protection, which
    // measured as costing a foreground program nothing: the same burst took a median 10.8 us beside unconfined workers and
    // 11.2 us beside confined ones.
    //
    // The mask has to be performance cores only. Leaving the efficiency cores in it as well, for the collector and the
    // chunk threads to use, gives the whole gain back: Windows puts the server thread on an efficiency core whenever one
    // is allowed, and a worker with one performance core plus all twelve efficiency ones measured 30.7 us, no better than
    // no mask at all.
    //
    // Every worker gets the same mask rather than a slice of its own, because a worker wants a performance core for its
    // server thread and bursts of the others for collection: two workers confined to one core between them measured worse
    // than no mask at all, two sharing four cores ran the pass at 19 us, and two sharing all eight at 13 us.
    //
    // Which processors those are is measured, once per machine, and kept in the calibration file beside the worker sizing.
    // The count comes from the chip's own numbers, which cannot be wrong: a performance core carries two logical
    // processors and an efficiency core one, so a machine reporting L logical processors and C cores has L - C performance
    // cores and twice that many logical processors. Which of them is then decided by timing the same arithmetic burst on
    // every logical processor and taking that many of the fastest, best of three bursts each so that other work on the
    // machine cannot push one of them into the wrong class. A machine whose cores are all alike, or whose spread is too
    // small to believe, comes out with no mask. -PworkerCores=all skips it.
    def performanceCores = { Properties calibration, File calibrationFile ->

        def processors = Runtime.runtime.availableProcessors()

        if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')
                || providers.gradleProperty('workerCores').getOrElse('') == 'all') {

            return 0L
        }

        if (calibration.getProperty('performanceCoresFor') == String.valueOf(processors)) {

            return Long.parseLong(calibration.getProperty('performanceCores', '0'))
        }

        // Sets its own affinity one processor at a time, which is the only way to find out what each one can do. The whole
        // thing is a few seconds, once per machine. Written out and run as a file rather than passed as a command, because
        // powershell -Command takes a multi-line script as one argument and then does not run all of it.
        def probe = '''
$ErrorActionPreference = 'Stop'
$self = Get-Process -Id $PID
$was = $self.ProcessorAffinity
$count = [Environment]::ProcessorCount
$times = @{}
for ($cpu = 0; $cpu -lt $count; $cpu++) {
    $self.ProcessorAffinity = [IntPtr]([long]1 -shl $cpu)
    $fastest = [double]::MaxValue
    for ($burst = 0; $burst -lt 3; $burst++) {
        $watch = [Diagnostics.Stopwatch]::StartNew()
        $sum = 0.0
        for ($i = 1; $i -le 60000; $i++) { $sum += [Math]::Sqrt($i) }
        $watch.Stop()
        if ($watch.Elapsed.TotalMilliseconds -lt $fastest) { $fastest = $watch.Elapsed.TotalMilliseconds }
    }
    $times[$cpu] = $fastest
}
$self.ProcessorAffinity = $was
$logical = (Get-CimInstance Win32_Processor | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
$cores = (Get-CimInstance Win32_Processor | Measure-Object -Property NumberOfCores -Sum).Sum
$wanted = 2 * ([int]$logical - [int]$cores)
$quickest = ($times.Values | Measure-Object -Minimum).Minimum
$slowest = ($times.Values | Measure-Object -Maximum).Maximum
$mask = 0
if ([int]$logical -eq $count -and $wanted -gt 0 -and $wanted -lt $count -and $slowest -gt $quickest * 1.3) {
    foreach ($entry in ($times.GetEnumerator() | Sort-Object Value | Select-Object -First $wanted)) {
        $mask = $mask -bor ([long]1 -shl $entry.Key)
    }
}
"$mask $([int]($quickest * 1000)) $([int]($slowest * 1000)) $wanted"
'''

        def mask = 0L
        def report = 'could not be measured'

        try {

            def script = layout.buildDirectory.file('gametest-cores.ps1').get().asFile
            script.parentFile.mkdirs()
            script.text = probe

            def builder = new ProcessBuilder('powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                    '-File', script.absolutePath)
            builder.redirectErrorStream(true)

            def measuring = builder.start()
            def output = measuring.inputStream.getText('UTF-8').trim()
            measuring.waitFor()

            def parts = output.readLines().findAll { it.trim() ==~ /^-?\d+ \d+ \d+ \d+$/ }

            if (!parts.isEmpty()) {

                def numbers = parts.last().trim().split(/\s+/)
                mask = Long.parseLong(numbers[0])
                report = String.format(Locale.ROOT, "%d of %d logical processors, the burst taking %.1f ms on the quickest "
                        + "and %.1f ms on the slowest", Long.bitCount(mask), processors,
                        Integer.parseInt(numbers[1]) / 1000.0d, Integer.parseInt(numbers[2]) / 1000.0d)
            }
        }

        catch (Exception exception) {

            // Never worth failing a run over: without a mask the workers simply run where they always did.
            report = "could not be measured (${exception})"
        }

        logger.lifecycle(mask == 0L
                ? "Cores: no performance cores to confine the workers to (${report}); they run wherever Windows puts them"
                : String.format(Locale.ROOT, "Cores: the workers will run on the performance cores only, mask 0x%X (%s)", mask, report))

        calibration.setProperty('performanceCores', String.valueOf(mask))
        calibration.setProperty('performanceCoresFor', String.valueOf(processors))

        calibrationFile.parentFile.mkdirs()
        calibrationFile.withOutputStream { calibration.store(it, 'Measured by runGametestParallel; delete to measure again') }

        return mask
    }

    // Only the parts of a world that hold its chunks. The test server writes fresh level data every time, and the saved
    // list of forced chunks would have the next worker load every site at once. Optionally only some of its region files.
    def copyWorld = { File from, File to, Closure wanted = { String name -> true } ->

        ['region', 'entities', 'poi'].each { part ->

            def source = new File(from, part)

            if (source.isDirectory()) {

                def target = new File(to, part)
                target.mkdirs()

                source.eachFile { file ->

                    if (wanted(file.name)) {

                        java.nio.file.Files.copy(file.toPath(), new File(target, file.name).toPath(),
                                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                }
            }
        }
    }

    // The region files around the world's origin, which hold the spawn area the server loads before anything else. Every
    // test world has the same seed, so these are the same in all of them.
    def spawnRegions = { String name -> name ==~ /r\.(-1|0)\.(-1|0)\.mca/ }

    // The terrain library: fight sites generated once and kept, which a terrain worker reads its sites from instead of
    // generating any ground itself, see TerrainLibrary. Built by buildTerrainLibrary (scripts\terrain.ps1). A worker uses
    // it whenever there is one, unless -PterrainLibrary=false; without one, workers generate their own as they always
    // did, with the pool of kept worlds above.
    // A worktree has no library of its own and must not link one in: it is read-only here -- every region file is hard
    // linked into each worker's world and never written -- so a worktree borrows the main checkout's where it has none.
    def terrainLibrary = {

        def own = new File(terrainPool, 'library')

        if (new File(own, 'library.properties').isFile()) {

            return own
        }

        def main = mainCheckout()

        if (main == null) {

            return own
        }

        def borrowed = new File(new File(new File(new File(main, 'runs'), 'terrain'),
                project.property('minecraft_version') as String), 'library')

        return new File(borrowed, 'library.properties').isFile() ? borrowed : own
    }()

    def libraryIndex = new File(terrainLibrary, 'library.properties')
    def libraryWanted = providers.gradleProperty('terrainLibrary').getOrElse('true').toBoolean()

    if (libraryIndex.isFile() && !terrainLibrary.absolutePath.startsWith(terrainPool.absolutePath)) {

        logger.lifecycle("No terrain library in this worktree; reading ${terrainLibrary}")
    }

    // Every region file of the library, linked into a worker's world rather than copied: a worker only ever reads them,
    // and a link costs nothing however big the library is, which a copy per worker per round would not. Copied where the
    // file system has no links. Only the chunks: the library's entities, the animals the generator put down, stay
    // behind, so a worker's sites start with no wildlife at all.
    def linkLibrary = { File world ->

        def target = new File(world, 'region')
        target.mkdirs()

        new File(terrainLibrary, 'region').eachFile { file ->

            def link = new File(target, file.name).toPath()

            try {

                java.nio.file.Files.createLink(link, file.toPath())
            }

            catch (UnsupportedOperationException | IOException ignored) {

                java.nio.file.Files.copy(file.toPath(), link, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }

    // The kept worlds, least used first and, among those, the longest unused.
    def keptTerrain = {

        def worlds = (terrainPool.listFiles() ?: []).findAll { new File(it, 'world.properties').isFile() }

        return worlds.collect { dir -> [dir: dir, properties: readProperties(new File(dir, 'world.properties'))] }.sort { a, b ->

            (a.properties.getProperty('uses', '0') as int) <=> (b.properties.getProperty('uses', '0') as int)
                    ?: new File(a.dir, 'world.properties').lastModified() <=> new File(b.dir, 'world.properties').lastModified()
        }
    }

    // After a round: every kept world a worker used counts one more use and goes once it is used up; one that was not
    // finished when the worker got it goes back with the sites the worker added; a world a worker generated fresh joins
    // the pool. Each worker says in terrain.properties where its sites were and how many it had ready by the end.
    def keepTerrain = { List workers ->

        workers.each { entry ->

            def report = readProperties(new File(entry.dir, 'terrain.properties'))
            def sites = (report.getProperty('sites') ?: '0') as int
            def world = new File(entry.dir, 'world')
            def healthy = entry.process.exitValue() == 0 && sites > 0

            // Only ever a saving for the runs after this one, so a world that cannot be kept, say because another run
            // has its files open, is let go rather than failing this run.
            try {

                if (entry.kept != null) {

                    def properties = entry.kept.properties
                    def uses = (properties.getProperty('uses', '0') as int) + 1

                    if (uses >= terrainUses) {

                        entry.kept.dir.deleteDir()
                        return
                    }

                    if (healthy && sites > (properties.getProperty('sites', '0') as int)) {

                        copyWorld(world, entry.kept.dir)
                        properties.setProperty('sites', String.valueOf(sites))
                    }

                    properties.setProperty('uses', String.valueOf(uses))
                    new File(entry.kept.dir, 'world.properties').withOutputStream { properties.store(it, null) }
                }

                else if (healthy && report.getProperty('x') != null && report.getProperty('z') != null) {

                    def dir = new File(terrainPool, "${report.getProperty('x')}_${report.getProperty('z')}")
                    dir.mkdirs()
                    copyWorld(world, dir)

                    // Written last, so a world only counts as kept once all of it is there.
                    def properties = new Properties()
                    ['x', 'z', 'sites'].each { properties.setProperty(it, report.getProperty(it)) }
                    properties.setProperty('uses', '1')
                    new File(dir, 'world.properties').withOutputStream { properties.store(it, null) }
                }
            }

            catch (IOException exception) {

                logger.lifecycle("Could not keep the terrain of worker ${entry.worker}: ${exception}")
            }
        }

        // Over the limit, the most used go first, and of those the least finished.
        def worlds = keptTerrain().sort { a, b ->

            (b.properties.getProperty('uses', '0') as int) <=> (a.properties.getProperty('uses', '0') as int)
                    ?: (a.properties.getProperty('sites', '0') as int) <=> (b.properties.getProperty('sites', '0') as int)
        }

        while (worlds.size() > terrainPoolSize) {

            worlds.remove(0).dir.deleteDir()
        }
    }

    // The Python environment under trainer/, which is where everything on the training side lives.
    //
    // A git worktree has none of its own, and a worktree that lives a few hours does not want gigabytes of PyTorch set up
    // in it, so it borrows the main checkout's. Where that is comes from git: a worktree's .git is a file naming the main
    // checkout's, and its parent is the checkout. The alternative, a junction from the worktree's trainer/.venv to the real
    // one, was made by hand in four worktrees at once and then cost the environment itself, because a recursive delete of a
    // worktree followed the junction and emptied the real thing. Better that there is nothing to follow.
    def pythonExecutable = {

        def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')
        def relative = windows ? 'trainer/.venv/Scripts/python.exe' : 'trainer/.venv/bin/python'
        def venv = new File(repositoryRoot, relative)

        if (!venv.isFile()) {

            def main = mainCheckout()
            def borrowed = main == null ? null : new File(main, relative)

            if (borrowed?.isFile()) {

                logger.lifecycle("No Python environment in this worktree; using ${borrowed}")
                return borrowed
            }

            throw new GradleException("No Python environment at ${venv}; run scripts/setup.ps1 or see trainer/README.md")
        }

        return venv
    }

    def runPython = { List<String> pythonArguments ->

        def command = [pythonExecutable().absolutePath, '-u']
        command += pythonArguments

        def builder = new ProcessBuilder(command as String[])
        builder.directory(new File(repositoryRoot, 'trainer'))
        builder.redirectErrorStream(true)

        def process = builder.start()

        process.inputStream.withReader('UTF-8') { reader -> reader.eachLine { line -> logger.lifecycle("[ai] " + line) } }

        def code = process.waitFor()

        if (code != 0) {

            throw new GradleException("The training side failed: ${pythonArguments.join(' ')}")
        }
    }

    // One round of arenas across several worker processes. Shared by the plain parallel run and the training run, which
    // differ only in what drives the agents and whether a training process has to be started first.
    //
    //   extraProperties  system properties every worker gets, which is how a training round names its run
    //   abortCheck       called while the workers run; returning a message kills them and fails the round
    //   onWorkerLost     when given, a worker that dies is reported to this and the others carry on, instead of the
    //                    round failing; a long training run should survive one process falling over
    //   arenasOverride   how many arenas this round runs, instead of the arenas property
    //   label            gives the workers a folder and a process list of their own, so two runs can go at once
    //
    // Returns how many arenas actually finished, and how they went.
    def runArenas = { String brainKind, int workerCap, Map extraProperties = [:], Closure abortCheck = null,
                      Closure onWorkerLost = null, String arenasOverride = null, String label = null ->

        // How many workers to start. Splitting a run only pays while a worker has more testing to do than starting
        // up: booting Minecraft costs roughly half a minute before a worker runs its first arena, and that is paid by
        // every worker at once. Too many workers and the run is mostly startup; too few and the cores sit idle.
        //
        // Rather than guess, this measures. Every run records how long startup took and how fast a worker got through
        // its arenas, and the next run sizes itself from those numbers, aiming to keep startup to about a third of the
        // whole run: each worker should spend at least twice its startup time actually testing.
        //
        // The very first run on a machine has nothing to go on and starts conservatively. Delete the calibration file
        // to measure again, or pass -Pworkers=N to override it entirely.
        def requestedArenas = (arenasOverride ?: providers.gradleProperty('arenas').getOrElse('')) as String
        def cores = Runtime.runtime.availableProcessors()
        // Never more than half the cores, never more than sixteen, and never more than the caller allows: a training run
        // has a training process to leave room for, and the machine has to stay usable while it runs.
        def workerCeiling = Math.max(1, Math.min(Math.min(16, workerCap), cores.intdiv(2)))
        def calibrationFile = layout.buildDirectory.file('gametest-calibration.properties').get().asFile

        def calibration = new Properties()

        if (calibrationFile.isFile()) {

            calibrationFile.withInputStream { calibration.load(it) }
        }

        def bootSeconds = (calibration.getProperty('bootSeconds') ?: '') as String
        def arenaRate = (calibration.getProperty('arenasPerWorkerSecond') ?: '') as String
        def lastArenas = (calibration.getProperty('arenas') ?: '') as String

        def defaultWorkers
        def sizing

        if (!bootSeconds.isEmpty() && !arenaRate.isEmpty() && !lastArenas.isEmpty()) {

            def boot = Double.parseDouble(bootSeconds)
            def rate = Double.parseDouble(arenaRate)
            // The count this run was asked for, when given, beats the one the last run happened to use.
            def arenas = requestedArenas.isEmpty() ? Integer.parseInt(lastArenas) : Integer.parseInt(requestedArenas)

            // Testing time per worker is (arenas / workers) / rate, and we want that to be at least twice the startup,
            // which rearranges to this.
            def ideal = arenas / (rate * 2.0d * boot)

            defaultWorkers = Math.max(1, Math.min(workerCeiling, (int) Math.round(ideal)))
            sizing = String.format(Locale.ROOT,
                    "measured %.0f s startup and %.1f arenas/second per worker, sizing for %,d arenas %s",
                    boot, rate, arenas, requestedArenas.isEmpty() ? "carried over from the last run" : "asked for by this run")
        }

        else {

            defaultWorkers = Math.max(1, Math.min(4, cores.intdiv(8)))
            sizing = 'no measurements yet, starting conservatively'
        }

        // What the workers fight on, which decides how much ground a worker holds and so how big a heap it needs. The
        // pool of kept worlds below reads these again; they are worked out here because the heap default depends on them.
        def suite = (extraProperties['modular_mob_ai.gametest.suite'] ?: providers.gradleProperty('suite').getOrElse('')) as String
        def onTerrain = suite == 'terrain' || suite == 'league'
        def onLibrary = onTerrain && libraryWanted && libraryIndex.isFile()

        // Nearly all of a worker's heap is the ground under and around the sites it is fighting on, so what the sites cost
        // is what the heap has to hold. Reading them from the terrain library costs a third of generating them: measured
        // over a full round, a worker on the library holds about 520 MB live and runs in a gigabyte, where one generating
        // its own ground settles at about 0.95 GB and needs more. So the library gets a gigabyte and everything else two,
        // which is what every run used to get. -PworkerHeap says otherwise.
        def heap = providers.gradleProperty('workerHeap').getOrElse(onLibrary ? '1G' : '2G')

        // Every worker is a whole Minecraft server, so memory caps the count as much as cores do. Each needs its heap
        // plus a little over four tenths of a gigabyte the heap does not cover, which is rounded up to half: measured
        // over a round of 24,000 fights on the library, a worker with a 1 GB heap peaked at 1.42 GB of private memory
        // and the same worker with the old 1.5 GB heap at 1.92 GB, the difference beyond the heap being the collector's
        // own tables, compiled code and class data. The machine keeps a reserve for everything else running on it.
        // Asking for more workers than fit is quietly cut down rather than allowed to push the machine into swapping,
        // which is where a long run turns a slow afternoon into a frozen desktop.
        def memory = java.lang.management.ManagementFactory.getOperatingSystemMXBean() as com.sun.management.OperatingSystemMXBean
        def gigabyte = 1024.0d * 1024.0d * 1024.0d
        def heapGigabytes = heap.toUpperCase(Locale.ROOT).endsWith('G') ? Double.parseDouble(heap[0..-2]) : Double.parseDouble(heap[0..-2]) / 1024.0d
        def perWorkerGigabytes = heapGigabytes + 0.5d
        def reserveGigabytes = Double.parseDouble(providers.gradleProperty('memoryReserve').getOrElse('3'))
        def freeGigabytes = memory.freeMemorySize / gigabyte
        def memoryCeiling = Math.max(1, (int) Math.floor((freeGigabytes - reserveGigabytes) / perWorkerGigabytes))

        def workers = Math.min(Math.min(workerCeiling, memoryCeiling),
                (providers.gradleProperty('workers').getOrElse(String.valueOf(defaultWorkers))) as int)

        if (workers < 1) {

            throw new GradleException("workers must be at least one")
        }

        if (memoryCeiling < workerCeiling && workers == memoryCeiling) {

            logger.lifecycle(String.format(Locale.ROOT,
                    "Limited to %d workers by memory: %.1f GB free, %.0f GB kept in reserve, about %.1f GB a worker",
                    workers, freeGigabytes, reserveGigabytes, perWorkerGigabytes))
        }

        // Which processors the workers may run on at all, and so how many there are to divide between them. See
        // performanceCores: on a chip with two kinds of core this is worth more than everything else the build does to a
        // worker put together.
        def coreMask = performanceCores(calibration, calibrationFile)

        // Whether the mask goes on the server thread alone instead of on the whole worker process, which is the thing the
        // process mask is really for: a worker is bound by its one server thread, and everything else it runs — the
        // collector, the chunk workers, netty, the compiler threads — is shut out of the efficiency cores for no reason.
        // Pinning the thread needs the thread's own cooperation, since Windows sets affinity per thread and a Java thread
        // has no handle to hand out, so the mask is passed in and the server thread applies it to itself on its first
        // tick; see ServerThreadAffinity.
        //
        //   -PserverThreadCores=performance   the server thread on the performance cores, the process on every core
        //   -PserverThreadCores=one           a performance core of its own for each worker's server thread
        //
        // Off by default: measured on this i7-14700KF it is no better than confining the process, and see findings.md
        // for what it does measure at.
        def threadSetting = providers.gradleProperty('serverThreadCores').getOrElse('off')

        if (!['off', 'performance', 'one'].contains(threadSetting)) {

            throw new GradleException("serverThreadCores must be off, performance or one, not '${threadSetting}'")
        }

        // Nothing to pin a thread to on a machine with no measured performance cores, so there the setting is moot and the
        // process mask it would have replaced is empty anyway.
        def pinThread = coreMask != 0L && threadSetting != 'off'

        // A pinned thread and a confined process are alternatives, not a pair: leaving the process confined as well would
        // keep the efficiency cores away from the collector, which is the whole point of pinning the thread.
        def processMask = pinThread ? 0L : coreMask

        // One logical processor of its own for each worker's server thread, taking every second processor of the mask so
        // that no two workers share a physical core's two hardware threads. Intel numbers a performance core's pair
        // adjacently, so the even members of the mask are one per core; workers past the eighth start round again.
        def threadMask = { int worker ->

            if (threadSetting != 'one') {

                return coreMask
            }

            def perCore = (0..63).findAll { (coreMask & (1L << it)) != 0L }.findAll { it % 2 == 0 }

            return perCore.isEmpty() ? coreMask : 1L << perCore[worker % perCore.size()]
        }

        def schedulable = processMask == 0L ? cores : Long.bitCount(processMask)

        // How the workers start and share the machine. A Minecraft server spends its first seconds compiling and loading
        // on every core it can see, and generates terrain on all of them after that, so each is shown its share of the
        // cores rather than all of them: the same total work, without a dozen servers fighting over every core at once.
        // Starting them a second apart keeps their boots from landing on the same instant. It was three, but every second
        // of it is paid once per worker by every run, and two servers booting side by side measured no slower than one.
        def staggerSeconds = Integer.parseInt(providers.gradleProperty('workerStagger').getOrElse('1'))
        def cpuSetting = providers.gradleProperty('workerCpus').getOrElse('auto')
        def workerCpus = cpuSetting == 'auto' ? Math.max(2, schedulable.intdiv(workers)) : Integer.parseInt(cpuSetting)

        // Below this much free memory the workers are stopped rather than left to take the machine down with them.
        def minimumFreeGigabytes = Double.parseDouble(providers.gradleProperty('memoryFloor').getOrElse('1.5'))

        // How long the shortage has to last first. Killing on the first reading threw away a round whenever anything else
        // on the machine took a large bite for a moment: a game starting, a browser, a script of ours reading a rollout
        // shard. Ten seconds under the floor is a real shortage; a spike is not, and the floor sits well clear of nothing
        // so waiting it out costs the machine little.
        def memoryGraceSeconds = Double.parseDouble(providers.gradleProperty('memoryGrace').getOrElse('10'))

        // Anything else a worker's virtual machine should be started with, split on spaces: a profiler, or a collector to
        // try out, without editing the build. A relative file lands in the worker's own folder, which the next run clears.
        //
        //   -PworkerJvmArgs="-XX:StartFlightRecording=delay=60s,duration=120s,filename=worker.jfr,settings=profile"
        def workerJvmArgs = providers.gradleProperty('workerJvmArgs').getOrElse('').trim()

        def javaExe = runTask.javaLauncher.get().executablePath.asFile.absolutePath

        def jvmArgs = []
        jvmArgs += runTask.jvmArgs
        runTask.jvmArgumentProviders.each { jvmArgs += it.asArguments() }
        runTask.systemProperties.each { key, value -> jvmArgs += "-D${key}=${value}".toString() }

        def programArgs = []
        programArgs += runTask.args
        runTask.argumentProviders.each { programArgs += it.asArguments() }

        // Loom keeps the run classpath on the task, where it can simply be read. ModDevGradle instead assembles it
        // while the task is running, so there is nothing on the task to read: there it is the game test runtime
        // classpath plus the small launcher jar named by the argument file that sits beside the virtual machine one.
        def classpath = runTask.classpath.files
        def classpathArgs = []

        if (!classpath.isEmpty()) {

            classpathArgs += '-cp'
            classpathArgs += classpath.join(File.pathSeparator)
        }

        else {

            def entries = []

            jvmArgs.findAll { it.startsWith('@') && it.endsWith('RunVmArgs.txt') }.each { vmArgFile ->

                def candidate = new File(vmArgFile.substring(1).replace('RunVmArgs.txt', 'RunClasspath.txt'))

                if (candidate.isFile()) {

                    // An argument file holding '-classpath' and then the launcher jar, with its separators doubled.
                    def doubled = File.separator + File.separator
                    candidate.readLines().drop(1).each { entries += it.trim().replace(doubled, File.separator) }
                }
            }

            entries += sourceSets.gametest.runtimeClasspath.files.collect { it.absolutePath }
            entries = entries.findAll { !it.isEmpty() }.unique()

            if (entries.isEmpty()) {

                throw new GradleException("Could not work out the run classpath for ${runTask.path}")
            }

            classpathArgs += '-cp'
            classpathArgs += entries.join(File.pathSeparator)
        }


        def root = label == null
                ? layout.buildDirectory.dir('gametest-parallel').get().asFile
                : layout.buildDirectory.dir("training/${label}").get().asFile

        // A run that was cancelled or crashed leaves its workers behind: they are separate processes and nothing stops
        // them when the build does. On Windows they also keep their log files open, so the directory below cannot even
        // be cleared until they are gone. Their process ids are written when they start, so they can be cleaned up
        // here. The file lives outside the directory being deleted so it survives to be read.
        def pidFile = label == null
                ? layout.buildDirectory.file('gametest-parallel-pids.txt').get().asFile
                : layout.buildDirectory.file("training/${label}-workers.txt").get().asFile

        if (pidFile.isFile()) {

            pidFile.readLines().each { line ->

                def pid = line.trim()

                if (pid.isEmpty()) {

                    return
                }

                try {

                    ProcessHandle.of(pid as long).ifPresent { handle ->

                        // A process id gets reused eventually, so only ever stop one that is still a java process.
                        def command = handle.info().command().orElse('')

                        if (handle.isAlive() && command.toLowerCase(Locale.ROOT).endsWith('java.exe') || command.endsWith('/java')) {

                            logger.lifecycle("Stopping a game test worker left behind by an earlier run (pid ${pid})")
                            handle.destroyForcibly()
                            handle.onExit().get(15, java.util.concurrent.TimeUnit.SECONDS)
                        }
                    }
                }

                catch (Exception ignored) {

                    // Already gone, or not ours to stop.
                }
            }

            pidFile.delete()
        }

        // Windows can hold a handle open for a moment after the process dies, so the clear gets a few attempts.
        for (int attempt = 0; root.exists() && attempt < 10; attempt++) {

            root.deleteDir()

            if (root.exists()) {

                Thread.sleep(500)
            }
        }

        if (root.exists()) {

            throw new GradleException("Could not clear ${root}; something still has files open in it")
        }

        root.mkdirs()

        def started = System.nanoTime()
        def processes = []

        // Everything that should stop a round early, checked while workers are starting and while they run: the caller's
        // own reason, and the machine running out of memory. Either one kills the workers before throwing.
        // When memory first went under the floor and has stayed there, or zero while it is above it.
        def lowSince = 0L

        def checkHealth = {

            def trouble = abortCheck != null ? abortCheck() : null

            if (trouble == null) {

                def free = memory.freeMemorySize / gigabyte

                if (free >= minimumFreeGigabytes) {

                    lowSince = 0L
                }

                else {

                    def now = System.nanoTime()
                    lowSince = lowSince == 0L ? now : lowSince
                    def heldSeconds = (now - lowSince) / 1_000_000_000.0d

                    if (heldSeconds >= memoryGraceSeconds) {

                        trouble = String.format(Locale.ROOT, "Stopped the workers to protect the machine: only %.1f GB of "
                                + "memory left free for %.0f s together (the floor is %.1f GB for %.0f s, set with "
                                + "-PmemoryFloor and -PmemoryGrace)", free, heldSeconds, minimumFreeGigabytes,
                                memoryGraceSeconds)
                    }
                }
            }

            if (trouble != null) {

                processes.each { it.process.destroyForcibly() }
                throw new GradleException(trouble)
            }
        }

        pidFile.parentFile.mkdirs()
        pidFile.text = ''

        // Worlds earlier workers generated, for as many of these as the pool has; the rest generate their own. While the
        // pool is short of worlds, one worker of every run generates a fresh one to add to it, or the pool would never grow
        // past the number of workers and those few worlds would all be used up at once.
        def pooled = onTerrain && terrainPoolSize > 0 && !onLibrary
        def keptWorlds = pooled ? keptTerrain() : []

        if (onLibrary) {

            logger.lifecycle("Terrain: every worker reads its sites from the terrain library in ${terrainLibrary}")
        }
        def poolShort = keptWorlds.size() < terrainPoolSize
        def spawnSource = keptWorlds.isEmpty() ? null : keptWorlds.first().dir

        keptWorlds = keptWorlds.take(Math.max(0, workers - (pooled && poolShort ? 1 : 0)))

        if (pooled) {

            def generating = workers - keptWorlds.size()

            logger.lifecycle("Terrain: ${keptWorlds.size()} of ${workers} workers start from a world kept in ${terrainPool}, "
                    + "${generating} generate${generating == 1 ? 's' : ''} a new one")
        }

        for (int worker = 0; worker < workers; worker++) {

            if (worker > 0 && staggerSeconds > 0) {

                for (int wait = 0; wait < staggerSeconds * 4; wait++) {

                    Thread.sleep(250)
                    checkHealth()
                }
            }

            // Two servers cannot share a world directory, and both loaders take the game directory from the working
            // directory, so each worker simply runs in its own.
            def dir = new File(root, "worker-${worker}")
            dir.mkdirs()

            def stats = new File(dir, 'durations.txt')

            def command = [javaExe]
            command += jvmArgs

            // Appended last so they win over anything the run configuration already set.
            command += "-Xmx${heap}".toString()

            // The forward pass's explicit vector loops, worth a tenth of the pass in a real tick. Added here as well as on
            // the run task above, because a loader whose run task is not a JavaExec would otherwise quietly hand its
            // workers the plain loops; asking for the module twice costs nothing. See brain/nn/ForwardVectors.java.
            command += '--add-modules'
            command += 'jdk.incubator.vector'

            // Vanilla's light engine hands readers a snapshot of where every lit section's light is by copying the whole
            // table every time it runs (LayerLightSectionStorage.swapSectionMap, once per light update per layer). With
            // the thousands of chunk sections a worker holds, each of the two arrays inside that copy is about a
            // megabyte. G1 sizes its regions at a two-thousandth of the heap, clamped to at least one megabyte, so at
            // every heap a worker runs in the regions are one megabyte and anything over half of one is a humongous
            // object: allocated straight into the old generation, and only freed by a full collection. Four megabyte
            // regions leave those copies ordinary young objects that die where they were born. Nothing else a worker
            // allocates is anywhere near that big, so the only cost is coarser regions.
            //
            // Measured over 6,000 fights on the library, a worker at one megabyte regions collected 360 times with 12 of
            // them full collections, and its log named a humongous allocation 137 times; at four megabytes the same
            // fights collected 156 times with one full collection and one such mention, and spent 0.94 s in pauses
            // against 2.78 s.
            command += '-XX:G1HeapRegionSize=4m'

            if (workerCpus > 0) {

                command += "-XX:ActiveProcessorCount=${workerCpus}".toString()
            }

            if (!workerJvmArgs.isEmpty()) {

                command += (workerJvmArgs.split(/\s+/) as List)
            }

            if (!requestedArenas.isEmpty()) {

                command += "-Dmodular_mob_ai.gametest.arenas=${requestedArenas}".toString()
            }

            if (pinThread) {

                command += "-Dmodular_mob_ai.gametest.serverThreadCores=${threadMask(worker)}".toString()
            }

            command += "-Dmodular_mob_ai.gametest.shardIndex=${worker}".toString()
            command += "-Dmodular_mob_ai.gametest.shardCount=${workers}".toString()
            command += "-Dmodular_mob_ai.gametest.statsFile=${stats.absolutePath}".toString()

            if (providers.gradleProperty('capture').isPresent()) {

                command += "-Dmodular_mob_ai.gametest.capture=${new File(dir, providers.gradleProperty('capture').get()).absolutePath}".toString()
            }

            // Which brain drives the agents. A neural one is told where its weights are, either by the caller for a
            // plain run or by the training round below; the shard index already on the command line is what tells a
            // training worker which share of the iteration is its own.
            if (!brainKind.isEmpty()) {

                command += "-Dmodular_mob_ai.brain=${brainKind}".toString()
            }

            if (providers.gradleProperty('brainWeights').isPresent()) {

                command += "-Dmodular_mob_ai.brain.weights=${fromRepositoryRoot(providers.gradleProperty('brainWeights').get()).absolutePath}".toString()
            }

            // Record whatever drives the agents, for looking at afterwards: -Pdemonstrations=runs/x/looked-at
            if (providers.gradleProperty('demonstrations').isPresent()) {

                command += "-Dmodular_mob_ai.demonstrations=${fromRepositoryRoot(providers.gradleProperty('demonstrations').get()).absolutePath}".toString()
            }

            extraProperties.each { name, value -> command += "-D${name}=${value}".toString() }

            def kept = keptWorlds.isEmpty() ? null : keptWorlds.remove(0)

            if (onLibrary) {

                linkLibrary(new File(dir, 'world'))
                command += "-Dmodular_mob_ai.gametest.library=${libraryIndex.absolutePath}".toString()
            }

            else if (kept != null) {

                try {

                    copyWorld(kept.dir, new File(dir, 'world'))
                    command += "-Dmodular_mob_ai.gametest.keptTerrain=${['x', 'z', 'sites'].collect { kept.properties.getProperty(it) }.join(',')}".toString()
                }

                catch (IOException exception) {

                    // Another run dropped it in the meantime, most likely. This worker generates its own instead.
                    logger.lifecycle("Could not copy the terrain in ${kept.dir}, worker ${worker} generates its own: ${exception}")
                    new File(dir, 'world').deleteDir()
                    kept = null
                }
            }

            // A worker generating a new world still gets the spawn area another worker generated, which the server loads
            // before it does anything else.
            if (kept == null && spawnSource != null) {

                try {

                    copyWorld(spawnSource, new File(dir, 'world'), spawnRegions)
                }

                catch (IOException exception) {

                    // Only a head start: the server generates the spawn area itself.
                    new File(dir, 'world').deleteDir()
                }
            }

            if (pooled) {

                command += "-Dmodular_mob_ai.gametest.terrainFile=${new File(dir, 'terrain.properties').absolutePath}".toString()
            }

            command += "-Dfabric-api.gametest.report-file=${new File(dir, 'report.xml').absolutePath}".toString()

            command += classpathArgs
            command += runTask.mainClass.get()
            command += programArgs

            def builder = new ProcessBuilder(command as String[])
            builder.directory(dir)
            builder.redirectErrorStream(true)
            builder.redirectOutput(new File(dir, 'log.txt'))

            def process = builder.start()

            // Below normal priority, so the desktop stays responsive however many of these are running, and on the
            // performance cores, because below normal is exactly what makes Windows park the server thread on an
            // efficiency core; see performanceCores. Both best effort: a worker that could not be placed still runs, just
            // where Windows wants it. Set the moment it starts, so only the first fraction of a second of loading is spent
            // anywhere else. A run pinning the server thread instead sets no process mask, and the worker pins itself.
            if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')) {

                try {

                    def placing = "\$worker = Get-Process -Id ${process.pid()}; \$worker.PriorityClass = 'BelowNormal'"

                    if (processMask != 0L) {

                        placing += "; \$worker.ProcessorAffinity = [IntPtr]${processMask}L"
                    }

                    new ProcessBuilder('powershell', '-NoProfile', '-Command', placing.toString()).start().waitFor()
                }

                catch (Exception ignored) {
                }
            }

            processes += [worker: worker, process: process, stats: stats, dir: dir, kept: kept]

            // Recorded as each one starts, so a run cancelled in the middle of starting them can still be cleaned up by
            // the next one.
            pidFile.append(process.pid() + System.lineSeparator())
        }

        def placement

        if (coreMask == 0L) {

            placement = ''
        }

        else if (!pinThread) {

            placement = String.format(Locale.ROOT, ", on the %d performance cores (mask 0x%X)",
                    Long.bitCount(coreMask), coreMask)
        }

        else if (threadSetting == 'one') {

            def own = []

            for (int pinned = 0; pinned < workers; pinned++) {

                own += Long.numberOfTrailingZeros(threadMask(pinned))
            }

            placement = ", every core, each server thread pinned to a performance core of its own (processor " +
                    own.join(', ') + ")"
        }

        else {

            placement = String.format(Locale.ROOT, ", every core, each server thread pinned to the %d performance " +
                    "cores (mask 0x%X)", Long.bitCount(coreMask), coreMask)
        }

        logger.lifecycle("Started ${workers} game test workers (${sizing}) under ${root}, ${staggerSeconds} s apart, "
                + "${workerCpus > 0 ? workerCpus + ' cores' : 'every core'} and ${heap} each" + placement)

        // Each worker publishes how far it has got beside its durations file. Summing those gives the progress of the
        // run as a whole, reported every tenth so a long run says something while it works.
        def progressAt = 10
        def lost = [] as Set

        while (processes.any { it.process.isAlive() }) {

            // Every two seconds, or at once when a worker exits, so the last one to finish is not left for up to two
            // seconds of the wall clock.
            processes.find { it.process.isAlive() }?.process?.waitFor(2, java.util.concurrent.TimeUnit.SECONDS)
            checkHealth()

            // A worker that stops while the rest carry on either finished its share early or fell over. Only a nonzero
            // exit is the second; when the caller can cope with that, it hears about it at once, while the others run.
            if (onWorkerLost != null) {

                processes.each { entry ->

                    if (!entry.process.isAlive() && !lost.contains(entry.worker) && entry.process.exitValue() != 0) {

                        lost.add(entry.worker)
                        logger.lifecycle("Worker ${entry.worker} stopped with exit code ${entry.process.exitValue()} "
                                + "(${new File(entry.dir, 'log.txt')}); carrying on with the others")
                        onWorkerLost(entry.worker)
                    }
                }
            }

            def done = 0L
            def expected = 0L

            processes.each { entry ->

                def progress = new File(entry.dir, entry.stats.name + '.progress')

                if (progress.isFile()) {

                    def parts = progress.text.trim().split(/\s+/)

                    if (parts.length == 2) {

                        done += parts[0] as long
                        expected += parts[1] as long
                    }
                }
            }

            // A worker only publishes once its first arena finishes, so early on the summed expectation covers just the
            // workers that have started reporting. Using it as the denominator makes the run look further along than
            // it is, so the count this run was asked for wins whenever it is known.
            def total = requestedArenas.isEmpty() ? expected : requestedArenas as long

            if (total <= 0L) {

                continue
            }

            def percent = Math.min(100L, (done * 100L).intdiv(total))

            if (percent >= progressAt) {

                def elapsed = (System.nanoTime() - started) / 1_000_000_000.0d

                logger.lifecycle(String.format(Locale.ROOT,
                        "  %d%% - %,d of %,d arenas after %.0f s", percent, done, total, elapsed))

                progressAt = (percent.intdiv(10) as int) * 10 + 10
            }
        }

        def failed = []

        processes.each { entry ->

            def code = entry.process.waitFor()

            if (code != 0) {

                failed += "worker ${entry.worker} exited with ${code} (${new File(entry.dir, 'log.txt')})"

                // Stopped in the last moments, after the loop above last looked.
                if (onWorkerLost != null && !lost.contains(entry.worker)) {

                    lost.add(entry.worker)
                    onWorkerLost(entry.worker)
                }
            }
        }

        // Every worker has exited, so there is nothing left for the next run to clean up.
        pidFile.delete()

        if (pooled) {

            keepTerrain(processes)
        }

        def seconds = (System.nanoTime() - started) / 1_000_000_000.0d

        // Every worker writes the durations it recorded, then its own server side totals as comment lines. Combining
        // has to happen on the raw values: a minimum, maximum and average cannot be recovered from per worker summaries.
        def durations = []
        def serverTicks = 0L
        def testSeconds = []
        def wins = 0L
        def losses = 0L
        def steadyArenaRates = []
        def steadyServerRates = []
        def steadyCpuRates = []

        processes.each { entry ->

            if (!entry.stats.exists()) {

                return
            }

            entry.stats.eachLine { line ->

                def trimmed = line.trim()

                if (trimmed.startsWith('#serverTicks')) {

                    serverTicks += trimmed.split(/\s+/)[1] as long
                }

                else if (trimmed.startsWith('#wins')) {

                    wins += trimmed.split(/\s+/)[1] as long
                }

                else if (trimmed.startsWith('#losses')) {

                    losses += trimmed.split(/\s+/)[1] as long
                }

                else if (trimmed.startsWith('#seconds')) {

                    testSeconds += Double.parseDouble(trimmed.split(/\s+/)[1])
                }

                else if (trimmed.startsWith('#steady')) {

                    def parts = trimmed.split(/\s+/)

                    steadyArenaRates += Double.parseDouble(parts[1])
                    steadyServerRates += Double.parseDouble(parts[2])
                    steadyCpuRates += Double.parseDouble(parts[3])
                }

                else if (!trimmed.isEmpty() && !trimmed.startsWith('#')) {

                    durations += trimmed as long
                }
            }
        }

        if (!durations.isEmpty()) {

            def arenaTicks = durations.sum() as long
            def average = arenaTicks / (double) durations.size()
            def configuredBatch = (providers.gradleProperty('batchSize').getOrElse('0')) as int
            def slots = Math.min(configuredBatch > 0 ? configuredBatch as long : 50L, durations.size() as long)

            def fmt = { double ticks -> String.format(Locale.ROOT, "%7.1f ticks (%5.2f seconds)", ticks, ticks / 20.0d) }

            println "========= Arena results over ${durations.size()} runs, ${workers} workers ========="
            println "  minimum      " + fmt(durations.min() as double)
            println "  maximum      " + fmt(durations.max() as double)
            println "  average      " + fmt(average)

            if (wins + losses > 0L) {

                println String.format(Locale.ROOT, "  won          %,7d (%5.1f%%)", wins, 100.0d * wins / (wins + losses))
                println String.format(Locale.ROOT, "  lost         %,7d (%5.1f%%)", losses, 100.0d * losses / (wins + losses))
            }

            // Throughput is measured against the time the workers spent testing, never the wall clock. They boot
            // alongside each other, so the testing window is however long the slowest one took; dividing by the wall
            // clock instead folds half a minute of starting virtual machines into a figure that is supposed to say
            // how fast arenas run, and makes a short run look far slower than a long one on the same machine.
            def testingSeconds = testSeconds.isEmpty() ? seconds : testSeconds.max() as double

            if (serverTicks > 0L) {

                def dead = 1.0d - arenaTicks / (double) (serverTicks * slots)

                println String.format(Locale.ROOT, "  server ticks %,d in %.2f s of testing", serverTicks, testingSeconds)
                println String.format(Locale.ROOT, "  arena ticks  %,d (%,.1f per second of testing)", arenaTicks, arenaTicks / testingSeconds)
                println String.format(Locale.ROOT, "  dead ticks   %.1f%% of %,d batch slots", dead * 100.0d, slots)
            }

            // The middle of each worker's run, with every slot busy: what a change to the cost of a tick shows up in,
            // free of how the first and last fights of the run happened to fall. Added up, since the workers run at once.
            // The last figure counts only the processor time each server thread actually got, so it holds still while
            // other work on the machine comes and goes.
            if (!steadyArenaRates.isEmpty()) {

                println String.format(Locale.ROOT, "  steady       %,.1f arena ticks per second from %d workers, %.1f server ticks per second each",
                        steadyArenaRates.sum() as double, steadyArenaRates.size(), (steadyServerRates.sum() as double) / steadyServerRates.size())
                println String.format(Locale.ROOT, "               %,.1f arena ticks per second of server thread processor time, per worker",
                        (steadyCpuRates.sum() as double) / steadyCpuRates.size())
            }

            println String.format(Locale.ROOT, "  wall clock   %.2f s, %.2f s of it starting %,d workers",
                    seconds, Math.max(0.0d, seconds - testingSeconds), workers)

            println "=" * 60
        }

        // A league run's workers each say how their fights against every opponent went, beside their durations: fights,
        // won, lost, timed out, drawn, in how many the opponent hurt the agent and went for it, and in how many the ground
        // finished the opponent rather than the agent; and the same for every loadout the agent carried, as loadout:NAME,
        // and every kind of ground it fought on, as site:NAME. Added up here.
        def leagueColumns = 8
        def league = [:] as TreeMap

        processes.each { entry ->

            def file = new File(entry.dir, entry.stats.name + '.league')

            if (!file.isFile()) {

                return
            }

            file.eachLine { line ->

                def parts = line.trim().split(/\s+/)

                if (parts.length == leagueColumns + 1) {

                    def tally = league[parts[0]]

                    if (tally == null) {

                        tally = [0L] * leagueColumns
                        league[parts[0]] = tally
                    }

                    for (int index = 0; index < leagueColumns; index++) {

                        tally[index] = (tally[index] as long) + Long.parseLong(parts[index + 1])
                    }
                }
            }
        }

        if (!league.isEmpty()) {

            println "========= League results, the agent against each opponent, with each loadout and on each ground ========="

            [['opponent', league.findAll { !it.key.startsWith('loadout:') && !it.key.startsWith('site:') }],
             ["agent's loadout", league.findAll { it.key.startsWith('loadout:') }],
             ['ground', league.findAll { it.key.startsWith('site:') }]].each { title, rows ->

                println String.format(Locale.ROOT, "  %-28s %6s %7s %7s %9s %7s %7s %9s %7s", title, 'fights', 'won %', 'lost %',
                        'timeout %', 'draw %', 'hit it', 'went for', 'ground')

                rows.each { name, tally ->

                    def fights = Math.max(1L, tally[0])
                    println String.format(Locale.ROOT, "  %-28s %6d %7.1f %7.1f %9.1f %7.1f %7d %9d %7d",
                            (name - 'loadout:') - 'site:', tally[0],
                            100.0d * tally[1] / fights, 100.0d * tally[2] / fights, 100.0d * tally[3] / fights,
                            100.0d * tally[4] / fights, tally[5], tally[6], tally[7])
                }
            }

            println "  hit it: fights in which the opponent hurt the agent; went for: in which it kept the agent as its target;"
            println "  ground: wins in which the ground finished the opponent rather than the agent"
            println "=" * 60
        }


        // Record what this run cost so the next one can size itself. Startup is what the wall clock has left over
        // once the longest worker stopped testing, since the workers boot alongside each other.
        if (!durations.isEmpty() && !testSeconds.isEmpty()) {

            def longestTest = testSeconds.max() as double
            def meanTest = testSeconds.sum() / (double) testSeconds.size()
            def observedBoot = Math.max(1.0d, seconds - longestTest)
            def observedRate = (durations.size() / (double) workers) / Math.max(0.001d, meanTest)

            // Added to what is already there rather than replacing it, so that the measured performance core mask, which
            // costs a few seconds to find and changes only when the machine does, survives every round.
            def measured = calibration
            measured.setProperty('bootSeconds', String.format(Locale.ROOT, "%.2f", observedBoot))
            measured.setProperty('arenasPerWorkerSecond', String.format(Locale.ROOT, "%.3f", observedRate))
            measured.setProperty('arenas', String.valueOf(durations.size()))
            measured.setProperty('workers', String.valueOf(workers))

            calibrationFile.parentFile.mkdirs()
            calibrationFile.withOutputStream { measured.store(it, 'Measured by runGametestParallel; delete to measure again') }

            def suggested = Math.max(1, Math.min(workerCeiling,
                    (int) Math.round(durations.size() / (observedRate * 2.0d * observedBoot))))

            println String.format(Locale.ROOT,
                    "  next run      will use %d workers (%.0f s startup, %.1f arenas/second per worker)",
                    suggested, observedBoot, observedRate)
        }

        if (!failed.isEmpty() && onWorkerLost == null) {

            throw new GradleException("Game test workers failed:\n  " + failed.join("\n  "))
        }

        return [completed: durations.size(), wins: wins, losses: losses, lost: lost.size(), workers: workers]
    }

    tasks.register('runGametestParallel') {

        group = 'modular mob ai'
        description = 'Runs the game test suite across several worker processes at once.'

        // The single process run task prepares everything a worker needs, so this borrows its dependencies without
        // running it.
        dependsOn runTask.taskDependencies

        doLast {

            runArenas(providers.gradleProperty('brain').getOrElse(''), 16)
            reportReplays()
        }
    }

    // Builds the terrain library, or adds to one: workers that fight nothing, each generating its share of the sites asked
    // for in blocks of its own, checking each site for somewhere to start a fight, and keeping their chunks; then their
    // worlds and indexes are put together. Vanilla generates most of a chunk one task at a time, so a builder gets through
    // about half a site a second whatever else the machine has free, and -Pworkers builders share the work.
    //
    //   gradlew :fabric:buildTerrainLibrary -PlibrarySites=4096 -Pworkers=4 -PworkerHeap=2G     a new library
    //   gradlew :fabric:buildTerrainLibrary -PaddSites=1024 -Pworkers=4                         a thousand more sites
    //
    // -PaddSites keeps everything the library already has and appends: only the new sites are generated, and the points
    // that existed keep the numbers they had, since points are numbered block by block and the new blocks go on the end.
    // A new library, by contrast, replaces the old one only once it is whole.
    //
    // Nothing half finished is ever readable, either way. The builders write into a staging folder; only when every one of
    // them has finished, and every pair of blocks has been checked to be far enough apart to have region files of its own,
    // are the new files moved into the library — whole, one atomic rename each — and only then is a new index moved over
    // the old one. Until that last move no point refers to any of the new files, so a worker reading the library sees
    // exactly what it saw before; and a worker already running holds its own hard links to the files it was given and never
    // looks at the index again. An addition that fails leaves a staging folder that the next one deletes.
    tasks.register('buildTerrainLibrary') {

        group = 'modular mob ai'
        description = 'Generates the terrain library, the fight sites terrain workers read instead of generating ground, or adds to it.'
        dependsOn runTask.taskDependencies

        doLast {

            // A worktree reads the main checkout's library where it has none of its own, and building is the one thing it
            // must not do to it: the rebuild path here starts by deleting the library it is replacing, so a build in a
            // worktree would delete the machine's ground rather than its own. There is one library per machine and it is
            // built where it lives.
            if (!terrainLibrary.absolutePath.startsWith(terrainPool.absolutePath)) {

                throw new GradleException("This checkout is reading the terrain library in ${terrainLibrary}, which belongs "
                        + "to the checkout it is a worktree of. Build or grow a library there, not here: doing it here would "
                        + "delete that one. There is one library per machine.")
            }

            def label = 'terrain-library'
            def added = Integer.parseInt(providers.gradleProperty('addSites').getOrElse('0'))

            // Adding needs something to add to. Asked to add where there is no library, the honest thing is to make one of
            // that size rather than to fail: it is what was wanted, and it is what a fresh machine needs.
            def existing = added > 0 && libraryIndex.isFile() ? readProperties(libraryIndex) : null

            if (added > 0 && existing == null) {

                logger.lifecycle("Terrain library: there is none in ${terrainLibrary} yet, so building one of ${added} sites rather than adding to it")
            }

            def staging = new File(terrainPool, existing == null ? 'library-building' : 'library-adding')
            def region = new File(staging, 'region')

            staging.deleteDir()
            region.mkdirs()

            // Each builder writes its index into its own folder, where a relative path lands. A builder adding to a library
            // is told where its index is, so that its new blocks land well clear of the ground already in it.
            def properties = [
                    'modular_mob_ai.gametest.suite'       : 'library',
                    'modular_mob_ai.gametest.library'     : 'library.properties',
                    'modular_mob_ai.gametest.librarySites': added > 0 ? String.valueOf(added)
                            : providers.gradleProperty('librarySites').getOrElse('4096')
            ]

            if (existing != null) {

                properties['modular_mob_ai.gametest.libraryAdding'] = libraryIndex.absolutePath
            }

            def result = runArenas('scripted', 16, properties, null, null, '1', label)

            // One index for all of it: the blocks the library already had, then each builder's, and every set of point
            // numbers moved along by the points of the blocks before its own.
            def blocks = []
            def unusable = []
            def kinds = [:] as LinkedHashMap
            def layoutLines = null
            def columns = 0
            def rows = 0
            def spacing = 0

            // Point numbers in a set, as both unusable and the kinds are written: "3,17,42", moved along by an offset.
            def pointsOf = { Properties from, String key, int offset ->

                from.getProperty(key, '').split(',').findAll { !it.trim().isEmpty() }.collect { (it.trim() as int) + offset }
            }

            def takeKinds = { Properties from, int offset ->

                from.getProperty('kinds', '').split(',').findAll { !it.trim().isEmpty() }.each { kind ->

                    kinds.computeIfAbsent(kind.trim(), { [] }).addAll(pointsOf(from, "kind.${kind.trim()}".toString(), offset))
                }
            }

            if (existing != null) {

                columns = existing.getProperty('columns') as int
                rows = existing.getProperty('rows') as int
                spacing = existing.getProperty('spacing') as int
                layoutLines = "spacing=${spacing}\ncolumns=${columns}\nrows=${rows}\n"

                for (int block = 0; existing.containsKey("block.${block}".toString()); block++) {

                    blocks += existing.getProperty("block.${block}".toString())
                }

                unusable += pointsOf(existing, 'unusable', 0)
                takeKinds(existing, 0)

                logger.lifecycle("Terrain library: ${blocks.size() * columns * rows} sites already in it, in ${blocks.size()} blocks")
            }

            for (int builder = 0; builder < result.workers; builder++) {

                def worker = layout.buildDirectory.dir("training/${label}/worker-${builder}").get().asFile
                def built = readProperties(new File(worker, 'library.properties'))
                def world = new File(worker, 'world/region')

                if (built.isEmpty() || !world.isDirectory()) {

                    throw new GradleException("Builder ${builder} did not finish its part of the terrain library; see ${new File(worker, 'log.txt')}")
                }

                // A library can only grow by blocks of the shape it already has: a point's number is worked out from the
                // columns and rows, so mixing two layouts in one index would move every point that already existed, and the
                // spacing says how much ground a site holds, so mixing two of those would leave half the sites short of the
                // chunks they tick. -PsiteRadius is what decides the spacing.
                if (columns != 0 && ((built.getProperty('columns') as int) != columns || (built.getProperty('rows') as int) != rows
                        || (built.getProperty('spacing') as int) != spacing)) {

                    throw new GradleException("The library in ${terrainLibrary} holds blocks of ${columns} by ${rows} sites "
                            + "${spacing} blocks apart, and this build lays out ${built.getProperty('columns')} by "
                            + "${built.getProperty('rows')} at ${built.getProperty('spacing')}; build a new library rather "
                            + "than adding to this one, or add at the -Radius it was built with")
                }

                columns = built.getProperty('columns') as int
                rows = built.getProperty('rows') as int
                spacing = built.getProperty('spacing') as int
                layoutLines = "spacing=${spacing}\ncolumns=${columns}\nrows=${rows}\n"

                def offset = blocks.size() * columns * rows

                for (int block = 0; built.containsKey("block.${block}".toString()); block++) {

                    blocks += built.getProperty("block.${block}".toString())
                }

                unusable += pointsOf(built, 'unusable', offset)
                takeKinds(built, offset)

                // Blocks lie far apart, so their region files never coincide; the spawn area's do, and are the same in
                // every world, so the first builder's are kept. Anything else that coincides is two blocks of ground on
                // top of each other, which would lose one of them, and is refused rather than quietly skipped. Moved where
                // the drive allows, copied otherwise.
                world.eachFile { file ->

                    def target = new File(region, file.name)
                    def live = new File(new File(terrainLibrary, 'region'), file.name)

                    if (spawnRegions(file.name)) {

                        if (!target.exists() && !live.exists() && !file.renameTo(target)) {

                            java.nio.file.Files.copy(file.toPath(), target.toPath())
                        }

                        return
                    }

                    if (target.exists() || existing != null && live.exists()) {

                        throw new GradleException("Builder ${builder} generated ground in ${file.name}, which the library "
                                + "already has: two blocks of sites landed on top of each other, and nothing has been "
                                + "changed. Running it again picks somewhere else. If it keeps happening on the same file, "
                                + "an addition that was interrupted between moving its ground in and writing its index left "
                                + "that file behind with nothing referring to it; delete it from "
                                + "${new File(terrainLibrary, 'region')} and run again.")
                    }

                    if (!file.renameTo(target)) {

                        java.nio.file.Files.copy(file.toPath(), target.toPath())
                    }
                }
            }

            // Every pair of blocks, old and new, far enough apart to have region files of its own. A builder keeps clear of
            // the library and of its own blocks, but two builders cannot see each other's choices, so this is the guard
            // that makes an addition safe. Checked before anything is moved into the library.
            // The same distance TerrainLibrary.BLOCKS_APART works out: a block's longer side plus four region files of
            // slack, which is 4,096 at the usual site radius of two and grows with it.
            def apart = rows * spacing + 2048
            def origins = blocks.collect { it.split(',').collect { part -> part.trim() as int } }

            for (int a = 0; a < origins.size(); a++) {

                for (int b = a + 1; b < origins.size(); b++) {

                    if (Math.abs(origins[a][0] - origins[b][0]) < apart && Math.abs(origins[a][1] - origins[b][1]) < apart) {

                        throw new GradleException("Two blocks of fight sites landed within ${apart} blocks of each other, at "
                                + "${blocks[a]} and ${blocks[b]}, so they would share region files. Nothing has been "
                                + "changed; run it again.")
                    }
                }
            }

            def text = new StringBuilder(layoutLines)
            blocks.eachWithIndex { block, index -> text.append("block.${index}=${block}\n") }
            text.append("unusable=${unusable.join(',')}\n")
            text.append("kinds=${kinds.keySet().join(',')}\n")
            kinds.each { kind, points -> text.append("kind.${kind}=${points.join(',')}\n") }

            if (existing == null) {

                new File(staging, 'library.properties').text = text.toString()

                terrainLibrary.deleteDir()

                if (!staging.renameTo(terrainLibrary)) {

                    throw new GradleException("Could not move the new terrain library into ${terrainLibrary}; it is in ${staging}")
                }
            }

            else {

                // The new ground goes in first, one whole file at a time, while no point in the index refers to any of it;
                // then the index. A rename inside one file system is atomic, so a worker linking the library at this moment
                // sees each file either not at all or all of it. Where a rename cannot be done, the copy goes to a
                // temporary name and is renamed, which comes to the same thing.
                def live = new File(terrainLibrary, 'region')
                live.mkdirs()

                (region.listFiles() ?: []).each { file ->

                    def target = new File(live, file.name)

                    if (target.exists()) {

                        return
                    }

                    if (!file.renameTo(target)) {

                        def partial = new File(live, file.name + '.partial')
                        java.nio.file.Files.copy(file.toPath(), partial.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                        java.nio.file.Files.move(partial.toPath(), target.toPath(), java.nio.file.StandardCopyOption.ATOMIC_MOVE)
                    }
                }

                def temporary = new File(terrainLibrary, 'library.properties.tmp')
                temporary.text = text.toString()
                java.nio.file.Files.move(temporary.toPath(), libraryIndex.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)

                staging.deleteDir()
            }

            def size = (new File(terrainLibrary, 'region').listFiles() ?: []).sum { it.length() } ?: 0L
            def points = blocks.size() * columns * rows

            logger.lifecycle(String.format(Locale.ROOT, "Terrain library: %,d sites in %,d blocks, %,d of them no fight can "
                    + "start on, %.0f MB in %s; terrain workers read their sites from it now", points, blocks.size(),
                    unusable.size(), size / 1048576.0d, terrainLibrary))
        }
    }

    // Checks that this build and PyTorch agree about the network, on weights and inputs PyTorch generated. Run before any
    // training, because without it a layout bug is indistinguishable from "reinforcement learning is hard".
    //
    //   gradlew :fabric:brainParity
    tasks.register('brainParity') {

        group = 'modular mob ai'
        description = "Checks this build's forward pass against PyTorch's, to a millionth."
        dependsOn 'gametestClasses'

        doLast {

            // Every body, unless one is named. A body nobody has trained yet is checked on a freshly made random network,
            // which proves just as much: what is being checked is that the two sides mean the same thing by a layout, and
            // the weights only have to be the same weights on both sides.
            def bodies = providers.gradleProperty('species').isPresent() ? [trainedSpecies] : allSpecies()

            bodies.each { body ->

                // One folder per run and body, so two training runs starting side by side do not write the same fixture at
                // once, and so one body's fixture never overwrites another's.
                def directory = layout.buildDirectory
                        .dir("brain-parity/${providers.gradleProperty('run').getOrElse('check')}/${body}").get().asFile
                def schema = new File(directory, 'schema.json')

                directory.mkdirs()

                // Anything else for the fixture, which is how the pass is timed at a size other than the usual one: the
                // widths travel in the weight file and the game reads them from there, so this needs no Java change.
                //
                //   gradlew :fabric:brainParity -PparityArgs="--h1 512 --hidden 256 --h3 256"
                def parityArgs = providers.gradleProperty('parityArgs').getOrElse('').trim()

                brainTool(['schema', body, schema.absolutePath])
                runPython(['train.py', 'parity', '--schema', schema.absolutePath, '--out', directory.absolutePath]
                        + (parityArgs.isEmpty() ? [] : splitArguments(parityArgs)))
                brainTool(['parity', directory.absolutePath])
            }
        }
    }

    // Records what the scripted fighter would do, for a network to learn to copy before reinforcement learning takes over.
    // Without -Pstudent the scripted fighter drives, and its record replaces the teacher folder for the suite it drove on.
    // With -Pstudent a copy drives and the scripted fighter labels every tick of it, into the next round folder; those
    // rounds add up rather than replace each other. `train.py imitate` learns from everything under demos, and a training
    // run's --teacher-weight samples the same folders, so what is recorded here is what a run is pulled back towards.
    //
    // The folders are named after the suite, so a league record never lands on top of a vindicator one: the two are
    // records of different fights and a run may well want both.
    //
    //   gradlew :fabric:recordDemonstrations -Prun=imitate -Parenas=1000
    //   gradlew :fabric:recordDemonstrations -Prun=imitate -Parenas=1000 -Pstudent=runs/imitate/weights/000000.mbw
    //   gradlew :fabric:recordDemonstrations -Prun=league -Psuite=league -Parenas=4000 -Pstudent=runs/league/best.mbw
    tasks.register('recordDemonstrations') {

        group = 'modular mob ai'
        description = 'Records the scripted fighter, or a copy of it corrected by it, for a network to learn to copy.'
        dependsOn runTask.taskDependencies
        dependsOn 'gametestClasses'

        doLast {

            def runName = providers.gradleProperty('run').getOrElse('imitate')
            def runDirectory = new File(new File(repositoryRoot, 'runs'), runName)
            def student = providers.gradleProperty('student').map { fromRepositoryRoot(it) }.getOrNull()
            def suite = providers.gradleProperty('suite').getOrElse('terrain')

            if (student != null && !student.isFile()) {

                throw new GradleException("No weights at ${student}")
            }

            // Same reason as a training run: a fight on natural ground reads its site from the library, and a worker that
            // has to generate its own instead costs two to three cores and a third more memory.
            if ((suite == 'terrain' || suite == 'league') && libraryWanted && !libraryIndex.isFile()) {

                throw new GradleException("No terrain library in ${terrainLibrary}. Build one first with "
                        + "scripts\\terrain.ps1, or pass -PterrainLibrary=false to have every worker generate its own "
                        + "ground as before.")
            }

            // The suite the record was made on, in the folder name. The terrain suite keeps the names it always had, so
            // every run recorded before this still reads as one record.
            def flavour = suite == 'terrain' ? '' : "${suite}-"
            def demonstrations

            if (student == null) {

                demonstrations = new File(runDirectory, "demos/${flavour}teacher")
                demonstrations.deleteDir()
            }

            else {

                int round = 1

                while (new File(runDirectory, "demos/${flavour}round-${round}").exists()) {

                    round++
                }

                demonstrations = new File(runDirectory, "demos/${flavour}round-${round}")
                logger.lifecycle("${student.name} drives on the ${suite} suite, the scripted fighter labels it, into ${demonstrations}")
            }

            demonstrations.mkdirs()

            // The trainer builds its network from the layout, so it goes in with the record. Held to the body the run
            // already has, since -Pspecies is easy to leave off a second command; see writeRunSchema.
            writeRunSchema(runDirectory)

            def properties = [
                    'modular_mob_ai.gametest.suite'        : suite,
                    'modular_mob_ai.demonstrations'        : demonstrations.absolutePath,
                    'modular_mob_ai.demonstrations.noise'  : providers.gradleProperty('demonstrationNoise').getOrElse('0.2')
            ]

            if (student != null) {

                properties['modular_mob_ai.brain.weights'] = student.absolutePath
            }

            // A worker that falls over only loses its own share of the record; the rest is still worth learning from. The
            // noise pushes the driver off target now and then, so the record shows how to get back.
            runArenas(student == null ? 'scripted' : 'neural', 16, properties, null, { int worker -> }, null, runName)
        }
    }

    // Trains the agents. The network runs in the game; this starts the process that improves it and then runs rounds of
    // arenas until stopped.
    //
    // An iteration is one policy: the workers play under iteration N's weights, write down what they did, and wait while
    // the training side learns from all of it and writes iteration N+1. The game never restarts for new weights, so a
    // round is only about how many arenas a set of worker processes runs before they are replaced; many iterations pass
    // inside one. Everything both sides say is forwarded into this build's output, prefixed [ai] and [brain].
    //
    //   gradlew :fabric:runTraining
    //   gradlew :fabric:runTraining -Parenas=5000 -ProlloutSteps=16384
    //   gradlew :fabric:runTraining -Prun=wider -PtrainArgs="--entropy-coef 0.003 --learning-rate 1e-4"
    tasks.register('runTraining') {

        group = 'modular mob ai'
        description = 'Trains the agents: rounds of arenas under weights the training process keeps improving.'
        dependsOn runTask.taskDependencies
        dependsOn 'brainParity'

        doLast {

            def runName = providers.gradleProperty('run').getOrElse('default')
            def runDirectory = new File(new File(repositoryRoot, 'runs'), runName)
            def rolloutSteps = providers.gradleProperty('rolloutSteps').getOrElse('16384')

            runDirectory.mkdirs()

            writeRunSchema(runDirectory)

            // A training process left behind by a cancelled run would write weights into the same folder, so it is
            // stopped before another starts. One whose build is still going is not left behind: that run is training
            // right now, and starting the same run a second time used to stop it dead, so this refuses instead.
            def trainerPidFile = layout.buildDirectory.file("training/${runName}-trainer.txt").get().asFile
            def inProgress = null

            if (trainerPidFile.isFile()) {

                try {

                    ProcessHandle.of(trainerPidFile.text.trim() as long).ifPresent { handle ->

                        if (handle.isAlive() && handle.info().command().orElse('').toLowerCase(Locale.ROOT).contains('python')) {

                            def owner = handle.parent().filter { it.isAlive() }.orElse(null)

                            if (owner != null && owner.info().command().orElse('').toLowerCase(Locale.ROOT).contains('java')) {

                                inProgress = handle.pid()
                            }

                            else {

                                logger.lifecycle("Stopping a training process left behind by an earlier run (pid ${handle.pid()})")
                                handle.destroyForcibly()
                                handle.onExit().get(15, java.util.concurrent.TimeUnit.SECONDS)
                            }
                        }
                    }
                }

                catch (Exception ignored) {

                    // Already gone, or not ours to stop.
                }

                if (inProgress != null) {

                    throw new GradleException("Run '${runName}' is already training (trainer pid ${inProgress}). Watch it with "
                            + "scripts\\watch.ps1 -Run ${runName}, stop it with scripts\\stop.ps1 -Run ${runName}, or give this one another -Run name.")
                }

                trainerPidFile.delete()
            }

            // Unbuffered, or Python holds its output in an eight kilobyte buffer whenever stdout is a pipe rather than a
            // terminal, and every training line would arrive at once when the process exits, or never if it is killed.
            def command = [pythonExecutable().absolutePath, '-u', 'train.py', 'loop',
                           '--run', runDirectory.absolutePath,
                           '--rollout-steps', rolloutSteps]

            // Training fights on natural terrain unless asked for the closed arena or the league, and on the league the
            // training side keeps the ratings and decides who is met; see trainer/mmai/league.py.
            def suite = providers.gradleProperty('suite').getOrElse('terrain')

            // Every fight on natural ground comes from the terrain library, built once by scripts\terrain.ps1. A worker
            // that generates its own ground instead takes two to three cores rather than one and a third more memory, and
            // memory is what caps how many workers run, so training without a library is training at half the pace for no
            // reason. A run says so and stops rather than quietly doing that; -PterrainLibrary=false asks for the old way.
            if ((suite == 'terrain' || suite == 'league') && libraryWanted && !libraryIndex.isFile()) {

                throw new GradleException("No terrain library in ${terrainLibrary}. Build one first with "
                        + "scripts\\terrain.ps1, which takes about half an hour, or pass -PterrainLibrary=false to have "
                        + "every worker generate its own ground as before.")
            }

            if (suite == 'league') {

                command += ['--league', 'true']
            }

            def extra = providers.gradleProperty('trainArgs').getOrElse('').trim()

            if (!extra.isEmpty()) {

                command += splitArguments(extra)
            }

            def builder = new ProcessBuilder(command as String[])
            builder.directory(new File(repositoryRoot, 'trainer'))
            builder.redirectErrorStream(true)

            // Whatever an earlier run said it was doing is not true of this one, and reading it would start the workers
            // before the new training process is ready for them.
            def statusFile = new File(runDirectory, 'trainer.status')
            statusFile.delete()

            // Written by the training side once evaluation says the run has got as good as it is going to. A run started
            // again is carried on, so whatever an earlier one decided goes.
            def finishedFile = new File(runDirectory, 'finished')
            finishedFile.delete()

            def trainer = builder.start()

            trainerPidFile.parentFile.mkdirs()
            trainerPidFile.text = String.valueOf(trainer.pid())

            // Forwarded line by line rather than inherited, because an inherited stream would go to this build's own
            // process and not to whoever is watching it.
            def pump = new Thread({

                trainer.inputStream.withReader('UTF-8') { reader ->

                    reader.eachLine { line -> logger.lifecycle("[ai] " + line) }
                }
            }, 'training-log')

            pump.daemon = true
            pump.start()

            // Waits until the training side is idle and has finished with every round up to the one given, then says
            // which iteration the next workers should play under. Starting them any earlier would have them collecting
            // experience under weights that are about to be replaced, or writing into a folder being emptied.
            def waitForTrainer = { int roundsNeeded ->

                for (int attempt = 0; ; attempt++) {

                    if (!trainer.isAlive()) {

                        throw new GradleException("The training process exited; see the [ai] lines above")
                    }

                    if (statusFile.isFile()) {

                        def parts = statusFile.text.trim().split(/\s+/)

                        if (parts.length == 3 && parts[0] == 'waiting' && (parts[2] as int) >= roundsNeeded) {

                            return parts[1] as int
                        }
                    }

                    if (attempt == 60) {

                        logger.lifecycle("Waiting for the training process to be ready")
                    }

                    Thread.sleep(250)
                }
            }

            // When to stop: after this many battles, or this many rounds, whichever comes first. Zero for either means no
            // limit from it, and with neither the run goes until it is stopped.
            def rounds = Integer.parseInt(providers.gradleProperty('rounds').getOrElse('0'))
            def battles = Integer.parseInt(providers.gradleProperty('battles').getOrElse('0'))
            def perRound = Integer.parseInt(providers.gradleProperty('arenas').getOrElse('2000'))

            // As many workers as the cores and the memory allow, unless told otherwise; runArenas cuts this down to fit.
            def maxWorkers = Integer.parseInt(providers.gradleProperty('maxWorkers').getOrElse('16'))

            // A few fights of every round written down for watching, in the run's own folder; -PreplayEvery=0 for none.
            def replays = replayProperties(runName, replayEvery(200))

            if (!replays['modular_mob_ai.replays'].isEmpty()) {

                logger.lifecycle("Replays of one fight in ${replays['modular_mob_ai.replays.every']} of each worker go to ${replays['modular_mob_ai.replays']}")
            }

            // What the training side needs to hear from here rather than from the workers: that a worker is gone for good,
            // so nothing waits for its shards, and that a round is over, so it can say when it has finished with it.
            def rollouts = new File(runDirectory, 'rollouts')
            def mark = { String folder, String name ->

                def directory = new File(rollouts, folder)
                directory.mkdirs()
                new File(directory, name).text = ''
            }

            def fought = 0
            def lastRound = 0
            def emptyRounds = 0

            try {

                for (int round = 1; (rounds <= 0 || round <= rounds) && (battles <= 0 || fought < battles) && !finishedFile.isFile(); round++) {

                    def iteration = waitForTrainer(round - 1)
                    def thisRound = battles > 0 ? Math.min(perRound, battles - fought) : perRound

                    logger.lifecycle("===== Training round ${round}: ${thisRound} battles from iteration ${iteration}"
                            + "${battles > 0 ? ', ' + fought + ' of ' + battles + ' fought so far' : ''} =====")

                    def result = runArenas('neural', maxWorkers, [
                            'modular_mob_ai.gametest.suite'       : suite,
                            'modular_mob_ai.training.run'         : runDirectory.absolutePath,
                            'modular_mob_ai.training.iteration'   : iteration,
                            'modular_mob_ai.training.round'       : round,
                            'modular_mob_ai.training.rolloutSteps': rolloutSteps
                    ] + replays, {

                        // Workers block waiting for the next weights, so a training process that has died would leave
                        // them waiting for good.
                        trainer.isAlive() ? null : "The training process exited during round ${round}; see the [ai] lines above"

                    }, { int worker ->

                        mark('gone', String.format(Locale.ROOT, 'r%04d-w%02d', round, worker))

                    }, String.valueOf(thisRound), runName)

                    mark('rounds', String.format(Locale.ROOT, 'r%04d.done', round))

                    fought += result.completed
                    lastRound = round

                    logger.lifecycle("Round ${round}: ${result.completed} battles fought, ${result.wins} won"
                            + "${result.lost > 0 ? ', ' + result.lost + ' of ' + result.workers + ' workers lost' : ''}; "
                            + "${fought}${battles > 0 ? ' of ' + battles : ''} in all")

                    // A round that finishes nothing, over and over, means the workers cannot run at all.
                    emptyRounds = result.completed == 0 ? emptyRounds + 1 : 0

                    if (emptyRounds >= 3) {

                        throw new GradleException("Three rounds in a row finished no battles; see the worker logs")
                    }
                }

                // The last round's final shards are still being learned from. Stopping the training process now would
                // throw that away, so it is given until it says it has finished with them.
                def learned = waitForTrainer(lastRound)

                if (finishedFile.isFile()) {

                    logger.lifecycle("Evaluation says the run is done: ${finishedFile.text.trim()}. The best weights are in ${new File(runDirectory, 'best.mbw')}")
                }

                logger.lifecycle("Training finished after ${fought} battles: the latest weights are iteration ${learned} in ${runDirectory}")
            }

            finally {

                // Stopped rather than asked to stop: the weights and checkpoints are already on disk, and a run that was
                // cancelled from the outside has no console for a polite shutdown to report to.
                trainer.destroy()

                if (!trainer.waitFor(10, java.util.concurrent.TimeUnit.SECONDS)) {

                    trainer.destroyForcibly()
                }

                trainerPidFile.delete()
            }
        }
    }
}
