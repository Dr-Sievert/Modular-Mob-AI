<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League · Modular Mob AI</title>
<!--
  The league standings of every run that has one, beside the replays: the tier list, the record against each opponent,
  with each loadout and on each kind of ground, and what each model does with its hands. It reads only what a run already
  writes, through viewer\serve.py, which has to be serving it: scripts\viewer.ps1 -League. See viewer\README.md.
-->
<style>
:root {
  --bg: #0c0f14; --bg2: #11151b; --panel: #151a21; --panel2: #1b212a; --line: #232a34; --line2: #313a47;
  --text: #e7ecf3; --muted: #8d97a8; --faint: #5d6778;
  --agent: #37e07a; --opp: #ff4d61; --amber: #ffb547; --cyan: #4cc9f0; --violet: #a78bfa; --blue: #4c8df6;
  --win: #37e07a; --loss: #ff4d61; --timeout: #ffb547;
  --mono: "Cascadia Mono", "JetBrains Mono", Consolas, ui-monospace, monospace;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg { display: block; }
a { color: var(--cyan); text-decoration: none; }
a:hover { text-decoration: underline; }

.app { min-height: 100vh; display: flex; flex-direction: column; }

/* ---- header ------------------------------------------------------------------------------------------------- */
.top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; flex-wrap: wrap;
  background: linear-gradient(180deg, #161b23, #11151b); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; white-space: nowrap; letter-spacing: .1px; }
.logo { width: 22px; height: 22px; border-radius: 7px; position: relative; flex: none;
  background: conic-gradient(from 200deg, var(--agent), var(--cyan), var(--violet), var(--opp), var(--amber), var(--agent));
  box-shadow: 0 2px 10px rgba(0,0,0,.45); }
.logo::after { content: ""; position: absolute; inset: 5px; border-radius: 3px; background: #11151b; }
.spacer { flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: baseline; gap: 5px; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  background: var(--panel2); border: 1px solid var(--line); font-size: 12px; }
.chip i { font-style: normal; color: var(--muted); font-size: 11px; }
.chip.dim { color: var(--muted); }
select { height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 11px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; white-space: nowrap; }
.btn:hover { background: #222a35; border-color: var(--line2); }
.btn.small { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.on { background: rgba(76,201,240,.14); border-color: rgba(76,201,240,.4); }
.live { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.live.on::before { background: var(--agent); animation: pulse 2.2s infinite; }
.live.off::before { background: var(--opp); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(55,224,122,.55); } 70% { box-shadow: 0 0 0 7px rgba(55,224,122,0); }
  100% { box-shadow: 0 0 0 0 rgba(55,224,122,0); } }

/* ---- tabs --------------------------------------------------------------------------------------------------- */
.tabs { display: flex; gap: 4px; padding: 0 14px; background: var(--bg2); border-bottom: 1px solid var(--line);
  position: sticky; top: 47px; z-index: 4; overflow-x: auto; }
.tabs button { padding: 9px 12px; background: transparent; border: 0; border-bottom: 2px solid transparent;
  color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--text); }
.tabs button.on { color: var(--text); border-bottom-color: var(--cyan); }

/* ---- sections ----------------------------------------------------------------------------------------------- */
main { padding: 14px; display: grid; gap: 14px; align-content: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.card > h2 { margin: 0; padding: 11px 14px 9px; font-size: 13.5px; font-weight: 650; border-bottom: 1px solid var(--line);
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card > h2 small { font-weight: 400; color: var(--muted); font-size: 11.5px; }
.note { padding: 9px 14px; color: var(--muted); font-size: 11.5px; line-height: 1.55; border-bottom: 1px solid var(--line);
  background: var(--bg2); }
.note code { font: 11px var(--mono); color: #cfd6e2; }
.scroll { overflow-x: auto; }
.pad { padding: 12px 14px; }
.side-by-side { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }

/* ---- tables ------------------------------------------------------------------------------------------------- */
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: right; padding: 5px 9px; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--panel2); color: var(--muted); font-weight: 600; font-size: 11.5px;
  cursor: pointer; user-select: none; z-index: 1; }
th.flat { cursor: default; }
th:first-child, td:first-child, .left { text-align: left; }
tbody tr:hover { background: #19202a; }
tbody tr.here { background: #1b2431; box-shadow: inset 3px 0 0 var(--cyan); }
td.num, th.num { font: 12px var(--mono); }
tr.sep td { border-top: 1px solid var(--line2); }
.dim { color: var(--muted); }
.faint { color: var(--faint); }
.bar { position: relative; }
.bar span { position: absolute; left: 0; top: 2px; bottom: 2px; background: rgba(76,201,240,.16); border-radius: 3px; }
.bar b { position: relative; font: 12px var(--mono); font-weight: 400; }

.tier { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; font-size: 11px;
  font-weight: 750; color: #0b0e12; }
.tier.S { background: #ff6ba8; } .tier.A { background: #ff9f5a; } .tier.B { background: #ffd75a; }
.tier.C { background: #8ee06a; } .tier.D { background: #4cc9f0; } .tier.E { background: #8d97a8; }
.tier.F { background: #5d6778; color: #dfe5ee; }
.kind { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: var(--panel2); color: var(--muted);
  border: 1px solid var(--line); }
.kind.model { color: #d8c6ff; border-color: rgba(167,139,250,.45); background: rgba(167,139,250,.13); }
.kind.scripted { color: #ffd9a8; border-color: rgba(255,181,71,.45); background: rgba(255,181,71,.12); }
.kind.checkpoint { color: #b9e6ff; border-color: rgba(76,201,240,.4); background: rgba(76,201,240,.12); }
.win { color: var(--win); } .loss { color: var(--loss); } .timeout { color: var(--timeout); }
.flag { font-size: 10.5px; color: var(--cyan); }
.watch { display: inline-block; padding: 0 5px; border-radius: 5px; border: 1px solid var(--line2); color: var(--muted);
  background: transparent; cursor: pointer; font: 11px var(--mono); }
.watch:hover { color: var(--text); border-color: var(--cyan); }
/* A row with nothing recorded is a control like any other: the drawer behind it holds the command that records some,
   which is the whole answer to "why can I only watch some of these". It was drawn flat once, so that a column of them
   would not read as a column of buttons, and it read instead as a row the page had nothing for. Dashed keeps the two
   apart at a glance without taking the offer away. */
.watch.none { border-style: dashed; color: var(--faint); }
.watch.none:hover { color: var(--text); }

/* ---- the rating curve --------------------------------------------------------------------------------------- */
.chart { width: 100%; height: 230px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--faint); font: 10px var(--mono); }
.chart .line { fill: none; stroke-width: 1.8; }
.chart .anchor { stroke: var(--amber); stroke-dasharray: 4 4; stroke-width: 1; }
.chart .dot { fill: var(--cyan); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 14px 12px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }

/* ---- the matrix --------------------------------------------------------------------------------------------- */
.matrix td.cell { font: 11.5px var(--mono); text-align: center; padding: 3px 6px; position: relative; cursor: pointer; }
.matrix td.cell.none { color: var(--faint); }
.matrix td.cell:hover { box-shadow: inset 0 0 0 1px var(--cyan); }
/* The share of the training fights the pairing is drawn in, under the cell that says how it went: two different things
   about one pairing, so the second is a line along the bottom rather than a second number to read. */
.matrix td.cell i { position: absolute; left: 1px; bottom: 1px; height: 2px; border-radius: 1px; background: var(--violet); }
.matrix .picked { display: inline-flex; gap: 4px; align-items: center; }
.matrix-note { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 14px;
  border-bottom: 1px solid var(--line); background: var(--bg2); font-size: 11.5px; color: var(--muted); }

/* ---- the drawer of recorded fights -------------------------------------------------------------------------- */
.drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(420px, 92vw); background: var(--bg2); z-index: 20;
  border-left: 1px solid var(--line2); display: flex; flex-direction: column; box-shadow: -18px 0 40px rgba(0,0,0,.5); }
.drawer h3 { margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 13px; display: flex;
  align-items: center; gap: 8px; }
.drawer .body { overflow-y: auto; padding: 6px; }
.drawer .row { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 8px; align-items: center;
  padding: 7px 8px; border-radius: 8px; }
.drawer .row:hover { background: #19202a; }
.drawer .row .what { overflow: hidden; text-overflow: ellipsis; }
.drawer .row .len { color: var(--muted); font: 11.5px var(--mono); }
.drawer .ask { padding: 10px 13px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11.5px;
  line-height: 1.6; }
.drawer .ask b { color: var(--text); font-weight: 600; }
.drawer .cmd { display: block; margin: 8px 0 2px; padding: 8px 9px; border-radius: 8px; background: var(--panel);
  border: 1px solid var(--line2); font: 11px var(--mono); color: #cfd6e2; white-space: pre-wrap; word-break: break-word; }
.badge { display: inline-grid; place-items: center; padding: 2px 0; border-radius: 5px; font-size: 9.5px; font-weight: 750;
  letter-spacing: .6px; text-transform: uppercase; }
.badge.win { color: #052010; background: var(--win); }
.badge.loss { color: #2a0409; background: var(--loss); }
.badge.timeout { color: #2a1a02; background: var(--timeout); }
.badge.draw { color: var(--muted); background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line2); }
.empty { padding: 34px 18px; text-align: center; color: var(--muted); line-height: 1.7; }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <span class="brand"><span class="logo"></span> League</span>
    <select id="run" title="Which run's league"></select>
    <select id="vs" title="A second run to read beside it"></select>
    <span class="chip dim" id="summary">–</span>
    <span class="spacer"></span>
    <span class="live" id="live">live</span>
    <a class="btn" href="/" title="The fight replays">Replays</a>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="main"></main>
</div>

<div class="drawer" id="drawer" hidden>
  <h3><span id="drawer-title">Recorded fights</span><span class="spacer"></span>
      <button class="btn small" id="drawer-close">Close</button></h3>
  <div class="body" id="drawer-body"></div>
</div>

<script>
'use strict';

// ---------------------------------------------------------------------------------------------------------------------
// The league standings page. Everything here comes from viewer\serve.py, which reads only the files a league run already
// writes: the trainer's tables in runs\<run>\league, the run's eval.csv, and the workers' per-fight records. Nothing is
// written anywhere, and no replay is read: a row links into the replay viewer instead.
//
// What a "model" is here is what the league rates: an evaluated checkpoint, iteration-006750, playing its most likely
// action. A training fight belongs to a policy that samples and is gone an iteration later, so those are counted for the
// run as a whole and never per model. A published network the run fields, vs-copy, is a player of the league like a mob
// is; see docs\training.md.
// ---------------------------------------------------------------------------------------------------------------------

const POLL_MS = 6000;

// The tiers scripts\league.ps1 prints, and for the same reason: 150 points is what a 70% expected score over the tier
// below comes to, and the scripted fighter, held at 1500, sits at the bottom of B.
const TIERS = [[1800, 'S'], [1650, 'A'], [1500, 'B'], [1350, 'C'], [1200, 'D'], [1050, 'E']];

const TABS = [
  ['tiers', 'Tier list'],
  ['opponents', 'Opponents'],
  ['loadouts', 'Loadouts and ground'],
  ['models', 'Models'],
  ['matrix', 'Opponent by loadout'],
  ['compare', 'Two runs'],
];

const state = {
  runs: [],
  run: '',
  vs: '',
  tab: 'tiers',
  cells: 'won',
  model: null,
  data: null,
  other: null,
  sort: {},
  failed: false,
};

const $ = (id) => document.getElementById(id);

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (name === 'class') node.className = value;
    else if (name === 'text') node.textContent = value;
    else if (name === 'html') node.innerHTML = value;
    else if (name.startsWith('on')) node.addEventListener(name.slice(2), value);
    else node.setAttribute(name, value === true ? '' : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}

/** The same for the chart, which has to be in the SVG namespace or the browser draws nothing at all. */
function svg(tag, attrs, text) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [name, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined) continue;
    node.setAttribute(name, String(value));
  }
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

const number = (value) => (value === null || value === undefined || value === '' ? null : Number(value));
const integer = (value) => Math.round(number(value) || 0);

function percent(part, whole, places) {
  if (!whole) return '–';
  return (100 * part / whole).toFixed(places === undefined ? 1 : places) + '%';
}

function tierOf(rating) {
  for (const [floor, name] of TIERS) if (rating >= floor) return name;
  return 'F';
}

function fixed(value, places) {
  return value === null || value === undefined || Number.isNaN(value) ? '–' : Number(value).toFixed(places || 0);
}

/** A count with a bar behind it, so a column of them reads as a shape as well as as numbers. */
function bar(value, of, text) {
  const width = of > 0 ? Math.max(0, Math.min(1, value / of)) : 0;
  return el('td', { class: 'num bar' }, el('span', { style: 'width:' + (100 * width).toFixed(1) + '%' }),
            el('b', { text: text === undefined ? String(value) : text }));
}

/** The outcome columns every table of fights has, as a share of its fights. */
function outcomes(row) {
  const fights = integer(row.fights);
  return [
    el('td', { class: 'num win', text: percent(integer(row.wins), fights) }),
    el('td', { class: 'num loss', text: percent(integer(row.losses), fights) }),
    el('td', { class: 'num timeout', text: percent(integer(row.timeouts), fights) }),
    el('td', { class: 'num dim', text: percent(integer(row.draws), fights) }),
  ];
}

// ---------------------------------------------------------------------------------------------------------------------
// Loading
// ---------------------------------------------------------------------------------------------------------------------

async function json(url) {
  const response = await fetch(url, { headers: { 'X-Replay-Viewer': '1' } });
  if (!response.ok) throw new Error(url + ': ' + response.status);
  return response.json();
}

async function loadRuns() {
  const listed = await json('/api/league');
  state.runs = listed.runs || [];
  if (!state.run || !state.runs.some((run) => run.name === state.run)) {
    state.run = state.runs.length ? state.runs[0].name : '';
  }
}

async function loadRun() {
  if (!state.run) { state.data = null; return; }
  const query = state.model === null ? '' : '?model=' + encodeURIComponent(state.model);
  state.data = await json('/api/league/' + encodeURIComponent(state.run) + query);
}

async function loadOther() {
  state.other = state.vs && state.vs !== state.run ? await json('/api/league/' + encodeURIComponent(state.vs)) : null;
}

/**
 * What is on screen, as one string. A poll that found nothing new draws nothing, so sorting a table or hovering a cell is
 * not undone every few seconds while a run trains.
 */
function stamp() {
  const of = (data) => !data ? '-' : [data.run, data.best, data.fights.overall.train.fights, data.fights.overall.eval.fights,
    (data.tables.ratings || []).length, data.fights.models.length, data.fights.recorded.length].join(':');
  return [state.tab, state.model, state.failed, of(state.data), of(state.other), state.runs.length,
          Object.keys(state.sort).length].join('|');
}

async function refresh(full) {
  try {
    if (full) await loadRuns();
    await loadRun();
    await loadOther();
    state.failed = false;
  } catch (error) {
    state.failed = true;
    state.message = String(error.message || error);
  }
  const now = stamp();
  if (now === state.stamp) {
    header();
    return;
  }
  state.stamp = now;
  draw();
}

// ---------------------------------------------------------------------------------------------------------------------
// The address bar holds what is on screen, so a view can be linked to
// ---------------------------------------------------------------------------------------------------------------------

function readAddress() {
  const query = new URLSearchParams(location.search);
  state.run = query.get('run') || '';
  state.vs = query.get('vs') || '';
  state.tab = TABS.some(([name]) => name === query.get('tab')) ? query.get('tab') : 'tiers';
  state.cells = CELLS.some(([name]) => name === query.get('cells')) ? query.get('cells') : 'won';
  const model = query.get('model');
  state.model = model && /^\d+$/.test(model) ? Number(model) : null;
}

function writeAddress() {
  const query = new URLSearchParams();
  if (state.run) query.set('run', state.run);
  if (state.vs) query.set('vs', state.vs);
  if (state.tab !== 'tiers') query.set('tab', state.tab);
  if (state.cells !== 'won') query.set('cells', state.cells);
  if (state.model !== null) query.set('model', String(state.model));
  const url = location.pathname + (query.toString() ? '?' + query : '');
  history.replaceState(null, '', url);
}

// ---------------------------------------------------------------------------------------------------------------------
// Sorting
// ---------------------------------------------------------------------------------------------------------------------

/**
 * A table that sorts by any of its columns. The columns say how to read themselves, so nothing here has to know what a
 * rating or an opponent's name is.
 */
function table(key, columns, rows, options) {
  const settings = options || {};
  const sort = state.sort[key] || settings.sort || { column: 0, down: true };
  const column = columns[sort.column] || columns[0];

  const ordered = rows.slice().sort((one, two) => {
    const a = column.value(one), b = column.value(two);
    const order = typeof a === 'string' || typeof b === 'string'
      ? String(a).localeCompare(String(b))
      : (a || 0) - (b || 0);
    return sort.down ? -order : order;
  });

  const head = el('tr', {}, columns.map((one, index) => el('th', {
    class: (one.num ? 'num ' : '') + (one.left ? 'left' : ''),
    title: one.title || null,
    onclick: () => {
      const down = sort.column === index ? !sort.down : true;
      state.sort[key] = { column: index, down };
      draw();
    },
  }, one.name + (sort.column === index ? (sort.down ? ' ▾' : ' ▴') : ''))));

  const body = el('tbody', {}, ordered.map((row, index) => settings.row(row, index)));
  return el('div', { class: 'scroll' }, el('table', { class: settings.class || null }, el('thead', {}, head), body));
}

// ---------------------------------------------------------------------------------------------------------------------
// The drawer: the recorded fights of one matchup
// ---------------------------------------------------------------------------------------------------------------------

/**
 * The recorded fights of one run, filed under everything a row might be about, newest first. Built in one pass and kept
 * against the data it was built from: a tier list of three hundred players asking a list of four thousand fights three
 * hundred times is most of a redraw, and there is nothing in it that changes between rows. Held in a WeakMap rather than
 * in state, so that the index of a run's data cannot outlive it and cannot be read for another run — the second tier
 * list of the two-runs tab is the other run's, and its rows have to count its own fights.
 */
const indexes = new WeakMap();

function index(data) {
  if (!data) return { opponent: new Map(), loadout: new Map(), site: new Map(), pair: new Map(), model: new Map() };
  const already = indexes.get(data);
  if (already) return already;
  const of = { opponent: new Map(), loadout: new Map(), site: new Map(), pair: new Map(), model: new Map() };
  const file = (map, key, fight) => {
    if (key === undefined || key === null || key === '') return;
    if (!map.has(key)) map.set(key, []);
    map.get(key).unshift(fight);
  };
  for (const fight of data.fights.recorded) {
    file(of.opponent, fight.opponent, fight);
    file(of.loadout, fight.loadout, fight);
    file(of.site, fight.site, fight);
    file(of.opponent, fight.iteration + '\t' + fight.opponent, fight);
    file(of.loadout, fight.iteration + '\t' + fight.loadout, fight);
    file(of.pair, fight.opponent + '\t' + fight.loadout, fight);
    file(of.model, fight.iteration, fight);
  }
  indexes.set(data, of);
  return of;
}

/** Every recorded fight of that run filed under that key, newest first, or none. */
function recorded(data, what, key) {
  return index(data)[what].get(key) || [];
}

/** What a run recorded, as the server measured it, with nothing assumed where it has written too little to say. */
function recording(data) {
  return (data && data.fights.recording) || { fights: 0, named: 0, on_disk: 0, every: null };
}

/**
 * The note under a table with a recorded column, which is the honest answer to why most rows have nothing in it. Every
 * number in it is measured: the fights come from the per-fight records, the replays from what is on disk, and the one in
 * N from the gaps between the replay names the recorder left, since nothing a run writes down says what -ReplayEvery it
 * was started with.
 */
function recordingNote(data) {
  const mine = recording(data);
  if (!mine.fights) {
    return el('div', { class: 'note' }, 'The recorded column is the fights of a row that were written down as replays. '
      + 'Nothing has been recorded yet.');
  }
  return el('div', { class: 'note' }, 'The last column is how many of a row’s own fights can be watched, against how many '
    + 'were fought. ' + data.run + ' has recorded ' + mine.named.toLocaleString() + ' of its '
    + mine.fights.toLocaleString() + ' fights'
    + (mine.every ? ', one in ' + mine.every + ' per worker (scripts\\train.ps1 -ReplayEvery)' : '')
    + ', and ' + mine.on_disk.toLocaleString() + ' of those are still on disk — so most rows have none, and a 0 there '
    + 'means none of that row’s fights was recorded, not that the fights are missing. Click any count for the list, or '
    + 'for the command that records some.');
}

/**
 * A row's recorded fights against the fights it is about: "▸ 3 / 214", or "0 / 214" for a row with none. It is the
 * second number that stops an empty cell reading as a page that has lost something — a run records one fight in 200 per
 * worker, so most matchups were never written down at all, and the difference between "none recorded" and "none played"
 * is the whole of what this column is for. Every row is a control, and no row is ever a dead end: one with recordings
 * opens the list of them, one with none opens the command that records forty of exactly that matchup.
 */
function watch(data, title, what, key, fought, ask) {
  const fights = recorded(data, what, key);
  const total = Number(fought) || 0;
  const label = (fights.length ? '▸ ' + fights.length : '0') + (total ? ' / ' + total.toLocaleString() : '');
  const every = recording(data).every;
  return el('button', {
    type: 'button',
    class: 'watch' + (fights.length ? '' : ' none'),
    title: (fights.length ? fights.length + ' of ' : 'None of ') + (total ? total.toLocaleString() + ' fights' : 'these fights')
           + ' recorded' + (every ? '; training records one fight in ' + every + ' per worker' : '')
           + (fights.length ? '. Click to watch them.' : '. Click for the command that records some.'),
    onclick: (event) => { event.stopPropagation(); openDrawer(data, title, fights, { fought: total, ask: ask || {} }); },
  }, label);
}

/**
 * A player's name as PowerShell has to be given it. A rung of the difficulty ladder is zombie(hard), and parentheses in
 * an unquoted argument start a sub-expression: pasted as it stands, the shell would go looking for a command called
 * hard. Anything but a plain word is quoted, which costs a pair of quotes on a squad and saves the command being wrong.
 */
function shellName(name) {
  return /^[A-Za-z0-9_.-]+$/.test(name) ? name : "'" + String(name).replace(/'/g, "''") + "'";
}

/**
 * The command that would record fights of this row, from the repository root. An evaluation is the one thing that can be
 * pointed at a matchup: it takes the opponents and the loadouts to fight, and -ReplayEvery 1 writes every fight down. A
 * cell of the matrix asks for both at once, which is one pairing and nothing else. The kind of ground cannot be asked
 * for, so a row about the ground gets the command without it.
 */
function recordCommand(run, ask) {
  const weights = ask.iteration === undefined || ask.iteration === null
    ? '-Weights runs\\' + run + '\\best.mbw'
    : '-Run ' + run + ' -Iteration ' + ask.iteration;
  return 'scripts\\eval.ps1 ' + weights + ' -Suite league -Arenas 40 -ReplayEvery 1'
    + (ask.opponent && ask.opponent !== '-' ? ' -Opponents ' + shellName(ask.opponent) : '')
    + (ask.loadout && ask.loadout !== '-' ? ' -Loadouts ' + shellName(ask.loadout) : '');
}

/** The head of the drawer: how much of this row was recorded, and, when that is nothing, how to record some. */
function askBlock(data, about) {
  const run = data.run, mine = recording(data), command = recordCommand(run, about.ask);
  const copy = el('button', { class: 'btn small', text: 'Copy' });
  copy.addEventListener('click', () => {
    navigator.clipboard.writeText(command).then(() => { copy.textContent = 'Copied'; },
      () => { copy.textContent = 'Select it and copy'; });
  });
  const folder = about.ask.iteration === undefined || about.ask.iteration === null
    ? 'runs\\eval-' + run + '-best\\replays' : 'runs\\eval-' + run + '-' + String(about.ask.iteration).padStart(6, '0') + '\\replays';
  // "None of these 214 fights was recorded", rather than a row that merely looks empty. A row whose fights nothing here
  // counts — there is no such row today — says only what it has.
  const said = !about.fought ? (about.count ? about.count + ' recorded fights.' : 'Nothing recorded.')
    : (about.count ? about.count + ' of ' : 'None of ') + about.fought.toLocaleString() + ' fights '
      + (about.count ? 'recorded.' : 'was recorded.');
  return el('div', { class: 'ask' },
    el('div', {}, el('b', { text: said }),
      ' ' + run + ' has written ' + mine.named.toLocaleString() + ' replays of its ' + mine.fights.toLocaleString()
      + ' fights' + (mine.every ? ', one in ' + mine.every + ' per worker (scripts\\train.ps1 -ReplayEvery)' : '')
      + ', of which ' + mine.on_disk.toLocaleString() + ' are still on disk.'),
    el('div', { style: 'margin-top:7px' }, 'To record ' + (about.count ? 'more of these' : 'some') + ':'),
    el('code', { class: 'cmd', text: command }),
    el('div', {}, copy, ' ', el('span', { text: ' They land in ' + folder + ' and show up in the replay list.' })),
    about.ask.iteration === undefined || about.ask.iteration === null ? null
      : el('div', { class: 'faint', style: 'margin-top:6px', text: 'That checkpoint has to be one the run still keeps in '
          + 'runs\\' + run + '\\weights; runs\\' + run + '\\best.mbw is always there.' }),
    // The ground a fight lands on is drawn by the suite, not chosen: a quarter of the fights are put on something worth
    // knocking an opponent into, and which of them comes up is the library's business. So a row about the ground gets the
    // command without a way to ask for that ground, and is told so rather than left to wonder why it did nothing.
    about.ask.ground ? el('div', { class: 'faint', style: 'margin-top:6px', text: 'Which ground a fight lands on cannot '
      + 'be asked for: the league suite draws it. Recording every fight of a short evaluation is how to catch one.' }) : null);
}

function openDrawer(data, title, fights, about) {
  $('drawer-title').textContent = title;
  const body = $('drawer-body');
  body.textContent = '';
  if (about) body.append(askBlock(data, { ...about, count: fights.length }));
  for (const fight of fights) {
    // The run the fights belong to, which on the two-runs tab is not always the one the header has picked.
    const url = '/?run=' + encodeURIComponent(data.run) + '&replay=' + encodeURIComponent(fight.file);
    body.append(el('a', { class: 'row', href: url, target: '_blank', rel: 'noopener' },
      el('span', { class: 'badge ' + fight.outcome, text: fight.outcome }),
      el('span', { class: 'what' },
        el('div', { text: fight.opponent }),
        el('div', { class: 'dim', style: 'font-size:11.5px',
                    text: fight.loadout + ' · ' + fight.kind + ' · iteration ' + fight.iteration
                          + (fight.site && fight.site !== '-' ? ' · ' + fight.site : '') })),
      el('span', { class: 'len', text: fight.ticks + 't' })));
  }
  $('drawer').hidden = false;
}

$('drawer-close').addEventListener('click', () => { $('drawer').hidden = true; });
document.addEventListener('keydown', (event) => { if (event.key === 'Escape') $('drawer').hidden = true; });

// ---------------------------------------------------------------------------------------------------------------------
// The tier list
// ---------------------------------------------------------------------------------------------------------------------

/** Every player of a run, with the share of the training fights the matchmaking gives it now. */
function players(data) {
  const shares = {};
  for (const row of data.tables.matchmaking || []) shares[row.opponent] = number(row.share) || 0;
  return (data.tables.ratings || []).map((row) => ({
    player: row.player,
    kind: row.kind || 'mob',
    rating: number(row.rating) || 0,
    games: integer(row.games),
    wins: integer(row.wins),
    losses: integer(row.losses),
    draws: integer(row.draws),
    share: shares[row.player] || 0,
    iteration: /^iteration-\d+$/.test(row.player) ? Number(row.player.slice('iteration-'.length)) : null,
  }));
}

/**
 * The tier list. Every player is a fixed policy: a mob, a squad of them, a rung of the difficulty ladder, the scripted
 * fighter, a published network the run fields, or a checkpoint of the run on its most likely action. Nothing adds any of
 * them up: two zombies are a player of their own, and so is a hard zombie.
 */
function tierList(data, options) {
  const settings = options || {};
  const all = players(data);
  const checkpoints = all.filter((one) => one.iteration !== null && one.games > 0)
                         .sort((one, two) => two.iteration - one.iteration);
  const shown = settings.every ? all
    : all.filter((one) => one.iteration === null || one.games > 0
                 && (checkpoints.indexOf(one) < (settings.checkpoints || 8) || one.iteration === data.best));

  const columns = [
    { name: 'player', value: (one) => one.player, left: true },
    { name: 'rating', value: (one) => one.rating, num: true },
    { name: 'rated', value: (one) => one.games, num: true, title: 'Rated fights: evaluation fights only' },
    { name: 'won', value: (one) => one.wins, num: true, title: "The player's own wins, not the agent's" },
    { name: 'lost', value: (one) => one.losses, num: true },
    { name: 'drawn', value: (one) => one.draws, num: true },
    { name: 'share', value: (one) => one.share, num: true, title: 'Share of the training fights it is given now' },
    { name: 'recorded', value: (one) => recorded(data, 'opponent', one.player).length, num: true,
      title: 'Recorded fights of the run against it, of every fight of the run against it' },
  ];

  const most = Math.max(1, ...shown.map((one) => one.games));

  return table('tiers' + (settings.key || ''), columns, shown, {
    sort: { column: 1, down: true },
    row: (one) => el('tr', { class: one.iteration === data.best ? 'here' : null },
      el('td', {},
        el('span', { class: 'tier ' + tierOf(one.rating), text: tierOf(one.rating) }), ' ',
        el('span', { text: one.player }), ' ',
        el('span', { class: 'kind ' + one.kind, text: one.kind }),
        one.iteration === data.best ? el('span', { class: 'flag', text: '  best, in best.mbw' }) : null),
      el('td', { class: 'num', text: fixed(one.rating, 0) }),
      bar(one.games, most),
      el('td', { class: 'num win', text: one.wins || '' }),
      el('td', { class: 'num loss', text: one.losses || '' }),
      el('td', { class: 'num dim', text: one.draws || '' }),
      el('td', { class: 'num dim', text: one.share > 0 ? percent(one.share, 1) : '' }),
      el('td', {}, watch(data, 'Fights against ' + one.player, 'opponent', one.player,
        (data.fights.opponents[one.player] || [0])[0], { opponent: one.player }))),
  });
}

/**
 * The run's rating over its checkpoints, which is the one line that says whether it is getting better: the opponents get
 * harder as the ladder opens rungs and the pool of checkpoints improves, so a win rate that holds still can mean either.
 * Drawn beside every fixed player worth a mark, since what a rating means is the distance to those.
 */
function ratingCurve(runs) {
  const width = 1000, height = 230, left = 46, right = 14, top = 12, bottom = 24;
  const series = runs.filter((one) => one.points.length > 1);
  if (!series.length) {
    return el('div', { class: 'empty', text: 'No checkpoint has been rated yet.' });
  }

  const xs = series.flatMap((one) => one.points.map((point) => point.iteration));
  const ys = series.flatMap((one) => one.points.map((point) => point.rating)).concat([1500]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1);
  const y0 = Math.floor(Math.min(...ys) / 50) * 50 - 25, y1 = Math.ceil(Math.max(...ys) / 50) * 50 + 25;
  const px = (value) => left + (width - left - right) * (value - x0) / (x1 - x0);
  const py = (value) => top + (height - top - bottom) * (1 - (value - y0) / (y1 - y0));

  const chart = svg('svg', { viewBox: '0 0 ' + width + ' ' + height, class: 'chart' });

  for (let rating = Math.ceil(y0 / 100) * 100; rating <= y1; rating += 100) {
    chart.append(svg('line', { class: 'grid', x1: left, x2: width - right, y1: py(rating), y2: py(rating) }));
    chart.append(svg('text', { class: 'axis', x: 4, y: py(rating) + 3.5 }, rating));
  }

  chart.append(svg('line', { class: 'anchor', x1: left, x2: width - right, y1: py(1500), y2: py(1500) }));
  chart.append(svg('text', { class: 'axis', x: width - right, y: py(1500) - 5, 'text-anchor': 'end' }, 'scripted, 1500'));

  for (const one of series) {
    const path = one.points.map((point, index) => (index ? 'L' : 'M') + px(point.iteration).toFixed(1) + ' '
                 + py(point.rating).toFixed(1)).join(' ');
    chart.append(svg('path', { class: 'line', d: path, stroke: one.colour }));
    const last = one.points[one.points.length - 1];
    chart.append(svg('circle', { class: 'dot', cx: px(last.iteration), cy: py(last.rating), r: 3, fill: one.colour }));
  }

  for (const value of [x0, Math.round((x0 + x1) / 2), x1]) {
    chart.append(svg('text', { class: 'axis', x: px(value), y: height - 6, 'text-anchor': 'middle' },
                     'iteration ' + value));
  }

  return chart;
}

/**
 * The checkpoints worth a point on the curve: the ones that were evaluated, which is what the per-fight records call a
 * model. Every other checkpoint in the ratings was met a handful of times from the self-play pool and has hardly moved
 * from where it started, so drawing those as well would bury the line the run is actually walking.
 */
function curveOf(data, colour) {
  const evaluated = new Set(data.fights.models.filter((one) => one.fights > 0).map((one) => one.iteration));
  const rated = players(data).filter((one) => one.iteration !== null && one.games > 0);
  const shown = rated.filter((one) => evaluated.has(one.iteration));
  const points = (shown.length > 1 ? shown : rated)
    .map((one) => ({ iteration: one.iteration, rating: one.rating }))
    .sort((one, two) => one.iteration - two.iteration);
  return { name: data.run, colour, points };
}

function opponentTable(data) {

      el('td', {}, watch(data, 'Fights against ' + one.opponent, 'opponent', one.opponent, one.run[0],

/**
 * The ground, and what finished the other side. This is the table the hazardous sites exist for: a fight the terrain ends
 * is the agent's win either way, so the share of its wins that the ground finished is the only sign that it has learned to
 * knock things into lava rather than only to fight next to it.
 */
function groundTable(data) {
  const rows = (data.tables.ground || []).map((row) => ({
    site: row.site,
    fights: integer(row.fights),
    wins: integer(row.wins),
    agent: integer(row.by_agent),
    terrain: integer(row.by_terrain),
    side: integer(row.by_side),
  }));

  const columns = [
    { name: 'ground', value: (one) => one.site, left: true },
    { name: 'fights', value: (one) => one.fights, num: true },
    { name: 'wins', value: (one) => one.wins, num: true },
    { name: 'won', value: (one) => one.fights && one.wins / one.fights, num: true },
    { name: 'by agent', value: (one) => one.agent, num: true },
    { name: 'by ground', value: (one) => one.terrain, num: true },
    { name: 'ground', value: (one) => one.wins && one.terrain / one.wins, num: true,
      title: 'Of its wins, the share the ground finished rather than the agent' },
    { name: 'by side', value: (one) => one.side, num: true, title: 'A creeper that blew up its own mate' },
    { name: 'recorded', value: (one) => recorded(data, 'site', one.site).length, num: true,
      title: 'Recorded fights on it, of every fight of the run on it' },
  ];

  const most = Math.max(1, ...rows.map((one) => one.wins && one.terrain / one.wins));

  return table('ground', columns, rows, {
    sort: { column: 1, down: true },
    row: (one) => el('tr', {},
      el('td', { text: one.site === '-' ? 'not recorded' : one.site }),
      el('td', { class: 'num', text: one.fights }),
      el('td', { class: 'num', text: one.wins }),
      el('td', { class: 'num win', text: percent(one.wins, one.fights) }),
      el('td', { class: 'num dim', text: one.agent }),
      el('td', { class: 'num', text: one.terrain }),
      bar(one.wins ? one.terrain / one.wins : 0, most, percent(one.terrain, one.wins)),
      el('td', { class: 'num dim', text: one.side }),
      // The denominator is the records' own count for that ground and not the trainer's fights column beside it, so that
      // it counts exactly the fights the recorded list was drawn from.
      el('td', {}, watch(data, 'Fights on ' + one.site, 'site', one.site,
        ((data.fights.sites || {})[one.site] || [0])[0], { ground: one.site }))),
  });
}

// ---------------------------------------------------------------------------------------------------------------------
// Per model, from the per-fight records
// ---------------------------------------------------------------------------------------------------------------------

/** The most of something, as "iron_sword 82%", from a map of name to count. */
function mostOf(counts, of) {
  const entries = Object.entries(counts || {}).sort((one, two) => two[1] - one[1]);
  if (!entries.length) return el('span', { class: 'faint', text: '–' });
  const [name, count] = entries[0];
  return el('span', {}, name, ' ', el('span', { class: 'dim', text: percent(count, of || count, 0) }));
}

/** Every count as its own line, biggest first: what the agent died of, which weapons it held. */
function breakdown(counts, of) {
  const entries = Object.entries(counts || {}).sort((one, two) => two[1] - one[1]);
  if (!entries.length) return el('div', { class: 'faint', text: 'nothing recorded' });
  const most = Math.max(...entries.map(([, count]) => count));
  return el('table', {}, el('tbody', {}, entries.map(([name, count]) => el('tr', {},
    el('td', { text: name }),
    el('td', { class: 'num', text: count }),
    bar(count, most, percent(count, of || most, 1))))));
}

function modelTable(data) {
  const rows = data.fights.models.map((one) => ({ ...one }));
  const ratings = {};
  for (const row of data.tables.ratings || []) {
    if (/^iteration-\d+$/.test(row.player)) ratings[Number(row.player.slice('iteration-'.length))] = number(row.rating);
  }
  const evaluated = {};
  for (const row of data.eval || []) evaluated[integer(row.iteration)] = row;

  const columns = [
    { name: 'model', value: (one) => one.iteration, num: true, left: true },
    { name: 'rating', value: (one) => ratings[one.iteration] || 0, num: true },
    { name: 'eval fights', value: (one) => one.fights, num: true },
    { name: 'won', value: (one) => one.fights && one.wins / one.fights, num: true },
    { name: 'lost', value: (one) => one.fights && one.losses / one.fights, num: true },
    { name: 'timeout', value: (one) => one.fights && one.timeouts / one.fights, num: true },
    { name: 'draw', value: (one) => one.fights && one.draws / one.fights, num: true },
    { name: 'ticks', value: (one) => one.fights && one.ticks / one.fights, num: true, title: 'Average fight length' },
    { name: 'most held', value: (one) => (one.weapon ? one.weapon[0] : ''), left: true,
      title: 'The item it held longest in more of its fights than any other' },
    { name: 'died of', value: (one) => (one.death ? one.death[0] : ''), left: true,
      title: 'What killed it most often, of the fights it lost by dying' },
    { name: 'swaps', value: (one) => one.fights && one.swaps / one.fights, num: true,
      title: 'Weapon swaps per fight: a slot chosen that changed the kind of item held' },
    { name: 'uses', value: (one) => one.fights && one.uses / one.fights, num: true,
      title: 'Uses begun per fight: a bow drawn, a shield raised, a block placed' },
    { name: 'shots', value: (one) => one.fights && one.shots / one.fights, num: true,
      title: 'Arrows and bolts loosed per fight' },
    { name: 'armed', value: (one) => one.fights && one.shot_fights / one.fights, num: true,
      title: 'Fights in which it fired at all' },
    // Every replay of that iteration, which is more than the evaluation fights this row counts: a training fight of the
    // same iteration is still that checkpoint's body being driven, and is still worth watching.
    { name: 'recorded', value: (one) => recorded(data, 'model', one.iteration).length, num: true,
      title: 'Recorded fights of this checkpoint, of the evaluation fights this row counts' },
  ];

  return table('models', columns, rows, {
    sort: { column: 0, down: true },
    row: (one) => el('tr', {
      class: one.iteration === state.model ? 'here' : null,
      style: 'cursor:pointer',
      onclick: () => { state.model = state.model === one.iteration ? null : one.iteration; writeAddress(); refresh(false); },
    },
      el('td', {}, 'iteration-' + String(one.iteration).padStart(6, '0'),
        one.iteration === data.best ? el('span', { class: 'flag', text: '  best' }) : null),
      el('td', { class: 'num', text: fixed(ratings[one.iteration], 0) }),
      el('td', { class: 'num', text: one.fights }),
      ...outcomes(one),
      el('td', { class: 'num dim', text: one.fights ? Math.round(one.ticks / one.fights) : '–' }),
      el('td', {}, one.weapon ? el('span', {}, one.weapon[0], ' ',
          el('span', { class: 'dim', text: percent(one.weapon[1], one.fights, 0) })) : el('span', { class: 'faint', text: '–' })),
      el('td', {}, one.death ? el('span', {}, one.death[0], ' ',
          el('span', { class: 'dim', text: percent(one.death[1], one.losses, 0) })) : el('span', { class: 'faint', text: '–' })),
      el('td', { class: 'num', text: one.fights ? (one.swaps / one.fights).toFixed(1) : '–' }),
      el('td', { class: 'num', text: one.fights ? (one.uses / one.fights).toFixed(1) : '–' }),
      el('td', { class: 'num', text: one.fights ? (one.shots / one.fights).toFixed(1) : '–' }),
      el('td', { class: 'num dim', text: percent(one.shot_fights, one.fights) }),
      el('td', {}, watch(data, 'iteration-' + String(one.iteration).padStart(6, '0'), 'model', one.iteration, one.fights,
        { iteration: one.iteration }))),
  });
}

/** One model in full: how it did against each opponent and with each loadout, and what it did with its hands. */
function modelDetail(data) {
  const model = data.fights.model;
  if (!model) {
    return el('div', { class: 'empty' }, 'Pick a model above to see how it did against each opponent and with each '
      + 'loadout, which weapon it held, and what it died of.');
  }

  const own = model.own;
  const name = 'iteration-' + String(model.iteration).padStart(6, '0');

  const pairs = (counts, title, key) => {
    const rows = Object.entries(counts).map(([one, [fights, wins]]) => ({ name: one, fights, wins }));
    return el('div', { class: 'card' }, el('h2', {}, title, el('small', { text: name })),
      // Said here because these two tables are the one place where the recorded count and the fights beside it are not
      // counted over the same fights: a row is this checkpoint's evaluation fights, while a replay of that iteration may
      // be a training fight, which is still worth watching and so is still linked.
      el('div', { class: 'note' }, 'Recorded is every replay of this checkpoint '
        + (key === 'model-opponents' ? 'against that opponent' : 'with that loadout')
        + '. One may be from a training fight of the same iteration, which the fights column does not count.'),
      table(key, [
        { name: title.split(' ')[0], value: (one) => one.name, left: true },
        { name: 'fights', value: (one) => one.fights, num: true },
        { name: 'won', value: (one) => one.wins, num: true },
        { name: 'win rate', value: (one) => one.fights && one.wins / one.fights, num: true },
        { name: 'recorded', value: (one) => recorded(data, key === 'model-opponents' ? 'opponent' : 'loadout',
          model.iteration + '\t' + one.name).length, num: true,
          title: 'Recorded fights of this checkpoint against it, of the evaluation fights this row counts' },
      ], rows, {
        sort: { column: 3, down: false },
        row: (one) => el('tr', {},
          el('td', { text: one.name }),
          el('td', { class: 'num', text: one.fights }),
          el('td', { class: 'num win', text: one.wins }),
          bar(one.fights ? one.wins / one.fights : 0, 1, percent(one.wins, one.fights)),
          el('td', {}, watch(data, name + ' vs ' + one.name, key === 'model-opponents' ? 'opponent' : 'loadout',
            model.iteration + '\t' + one.name, one.fights,
            key === 'model-opponents' ? { opponent: one.name, iteration: model.iteration }
                                      : { loadout: one.name, iteration: model.iteration }))),
      }));
  };

  return el('div', { class: 'side-by-side' },
    pairs(model.opponents, 'Opponent', 'model-opponents'),
    pairs(model.loadouts, 'Loadout', 'model-loadouts'),
    el('div', { class: 'card' }, el('h2', {}, 'Its hands', el('small', { text: own.fights + ' evaluation fights' })),
      el('div', { class: 'pad' },
        el('div', {}, el('b', { text: 'Most held: ' }), mostOf(own.weapons, own.fights)),
        el('div', { class: 'dim', style: 'margin-top:6px',
          text: (own.fights ? (own.swaps / own.fights).toFixed(1) : '–') + ' swaps, '
                + (own.fights ? (own.uses / own.fights).toFixed(1) : '–') + ' uses and '
                + (own.fights ? (own.shots / own.fights).toFixed(1) : '–') + ' shots a fight; it fired at all in '
                + percent(own.shot_fights, own.fights) + ' of them' })),
      el('div', { class: 'note', text: 'Every item it held, by the fights it held it longest in' }),
      el('div', { class: 'scroll' }, breakdown(own.weapons, own.fights)),
      el('div', { class: 'note', text: 'What it died of, when it died' }),
      el('div', { class: 'scroll' }, breakdown(own.causes, own.losses))));
}

// ---------------------------------------------------------------------------------------------------------------------
// Opponent by loadout
// ---------------------------------------------------------------------------------------------------------------------

/**
 * What the pair table says, by 'opponent\tloadout': the share of the training fights the matchmaking is drawing that
 * pairing in now, the chance it reckons the agent has in it, and the faded record that chance leans on. A run trained
 * before the trainer drew pairings has no league\pairs.csv, and this is simply empty; see trainer\mmai\league.py.
 */
function pairings(data) {
  const of = new Map();
  for (const row of data.tables.pairs || []) {
    if (!row.loadout || !row.opponent) continue;
    of.set(row.opponent + '\t' + row.loadout, { share: number(row.share) || 0, chance: number(row.chance) || 0,
                                                fights: number(row.fights) || 0, wins: number(row.wins) || 0 });
  }
  return of;
}

/** What the number in a matrix cell is. The colour and the line under it follow it; see matrix. */
const CELLS = [['won', 'won'], ['share', 'share'], ['chance', 'chance']];

/**
 * The two things worth knowing about one pairing at once: how it has gone, and how much of the curriculum it is being
 * given. The colour and the number are the first — the win rate over every fight of the run, green above half and red
 * below — and the violet line along the bottom of a cell is the second, that pairing's share of the training fights
 * against the largest share in the table. What the number is can be swapped for the share itself or for the chance the
 * trainer estimates, which is what it draws on: a pairing whose chance is near half is where it is sending the fights.
 *
 * Sparse by design. Matchmaking draws the pairing, so a pairing the agent always wins gets little more than the floor
 * that keeps everything coming round, and a cell of four fights says little. A row or a column can also come from the
 * pair table alone: a pairing with a share and no fights yet is where the fights are about to go.
 */
function matrix(data) {
  const cells = data.fights.cells, pairs = pairings(data);
  const loadouts = new Set(Object.keys(data.fights.loadouts));
  const opponents = new Set(Object.keys(data.fights.opponents));
  for (const key of pairs.keys()) {
    const [opponent, loadout] = key.split('\t');
    opponents.add(opponent);
    loadouts.add(loadout);
  }
  if (!opponents.size) return el('div', { class: 'empty', text: 'No fights recorded yet.' });

  const columns = [...loadouts].sort(), rows = [...opponents].sort();
  const shown = pairs.size ? state.cells : 'won';
  const most = Math.max(0, ...[...pairs.values()].map((one) => one.share)) || 1;
  // Where each loadout's fights go in all, which is the column's own share of the curriculum.
  const perLoadout = {};
  for (const [key, one] of pairs) perLoadout[key.split('\t')[1]] = (perLoadout[key.split('\t')[1]] || 0) + one.share;

  const head = el('tr', {}, el('th', { class: 'left flat', text: 'opponent' }),
    columns.map((one) => el('th', { class: 'flat num', text: one,
      title: perLoadout[one] ? one + ' is drawn in ' + percent(perLoadout[one], 1, 1) + ' of the training fights' : null })),
    el('th', { class: 'flat num', text: 'all' }));

  const body = el('tbody', {}, rows.map((opponent) => el('tr', {},
    el('td', { text: opponent }),
    columns.map((loadout) => {
      const key = opponent + '\t' + loadout;
      const cell = cells[key], pair = pairs.get(key);
      const fought = cell ? cell[0] : 0;
      const rate = fought ? cell[1] / fought : null;
      const value = shown === 'share' ? (pair ? pair.share : null)
                  : shown === 'chance' ? (pair ? pair.chance : null) : rate;
      const seen = recorded(data, 'pair', key).length;
      const tint = value === null ? null
        : shown === 'share'
          ? 'background: rgba(167,139,250,' + (0.06 + 0.34 * value / most).toFixed(3) + ')'
          : 'background: rgba(' + (value > 0.5 ? '55,224,122,' : '255,77,97,')
            + (0.06 + 0.34 * Math.abs(value - 0.5) * 2).toFixed(3) + ')';
      return el('td', {
        class: 'cell' + (value === null ? ' none' : ''), 'data-o': opponent, 'data-l': loadout, style: tint,
        title: [loadout + ' against ' + opponent,
                fought ? cell[1] + ' of ' + fought + ' fights won' : 'No fights yet',
                pair ? percent(pair.share, 1, 2) + ' of the training fights, at a chance of ' + percent(pair.chance, 1, 0)
                       + (pair.fights >= 0.05 ? ' over ' + pair.fights.toFixed(1) + ' faded fights' : ' guessed, nothing recent')
                     : null,
                seen ? seen + ' recorded; click to watch them' : 'Nothing recorded; click for the command that records some',
               ].filter(Boolean).join('\n'),
      }, value === null ? '·' : percent(value, 1, shown === 'share' ? 2 : 0),
         pair && pair.share > 0 && shown !== 'share'
           ? el('i', { style: 'width: calc(' + (100 * pair.share / most).toFixed(1) + '% - 2px)' }) : null);
    }),
    // The last column is the opponent whatever the agent carried, and opens the fights against it, as its row in the
    // other tables does.
    el('td', { class: 'cell dim', 'data-o': opponent, title: 'Every loadout; click for the fights against ' + opponent,
               text: percent((data.fights.opponents[opponent] || [0, 0])[1], (data.fights.opponents[opponent] || [0, 0])[0], 0) }))));

  // One listener for the whole table rather than one per cell: fifteen hundred pairings is fifteen hundred cells, and
  // every one of them opens the same drawer with a different pairing in it.
  const board = el('table', {
    class: 'matrix',
    onclick: (event) => {
      const cell = event.target.closest('td[data-o]');
      if (!cell) return;
      const opponent = cell.getAttribute('data-o'), loadout = cell.getAttribute('data-l');
      if (loadout === null) {
        openDrawer(data, 'Fights against ' + opponent, recorded(data, 'opponent', opponent),
          { fought: (data.fights.opponents[opponent] || [0])[0], ask: { opponent } });
        return;
      }
      openDrawer(data, loadout + ' against ' + opponent, recorded(data, 'pair', opponent + '\t' + loadout),
        { fought: (cells[opponent + '\t' + loadout] || [0])[0], ask: { opponent, loadout } });
    },
  }, el('thead', {}, head), body);

  return el('div', { class: 'scroll' }, board);
}

/** What a cell shows, and what the line under it means. A run with no pair table has only the one thing to show. */
function matrixControls(data) {
  if (!pairings(data).size) {
    // A plain note rather than the bar of buttons: there is nothing to choose between, and it should read as a sentence.
    return el('div', { class: 'note' }, 'This run has no ', el('code', { text: 'league\\pairs.csv' }), ', so nothing here '
      + 'says where its fights are being sent: it was started before the matchmaking drew the pairing. The cells are its '
      + 'win rate and nothing else.');
  }
  return el('div', { class: 'matrix-note' },
    el('span', { text: 'The number in a cell:' }),
    el('span', { class: 'picked' }, CELLS.map(([key, name]) => el('button', {
      type: 'button', class: 'btn small' + (state.cells === key ? ' on' : ''), text: name,
      title: key === 'won' ? 'The win rate over every fight of the run'
           : key === 'share' ? 'The share of the training fights this pairing is drawn in now'
           : 'The chance the trainer reckons the agent has in it, which is what it draws on',
      onclick: () => { state.cells = key; writeAddress(); draw(); },
    }))),
    el('span', { class: 'faint', text: '· the violet line under a cell is its share of the training fights, against the '
      + 'largest in the table · click a cell for its recorded fights' }));
}

// ---------------------------------------------------------------------------------------------------------------------
// Two runs
// ---------------------------------------------------------------------------------------------------------------------

/**
 * Two lineages side by side. What makes them comparable is the players both fought that never change: the scripted
 * fighter, held at 1500, and any published network both runs field. Where those two ratings disagree the scales have
 * drifted apart, and the tier lists should not be read against each other.
 */
function compare(data, other) {
  if (!other) {
    return el('div', { class: 'empty' }, 'Pick a second run in the header to read the two tier lists side by side, and to '
      + 'see whether the players they share agree about where 1500 is.');
  }

  const shared = [];
  const mine = {}, theirs = {};
  for (const row of data.tables.ratings || []) mine[row.player] = row;
  for (const row of other.tables.ratings || []) theirs[row.player] = row;
  for (const name of Object.keys(mine)) {
    const kind = mine[name].kind;
    if (!theirs[name] || (kind !== 'model' && kind !== 'scripted')) continue;
    shared.push({ player: name, kind, one: number(mine[name].rating), two: number(theirs[name].rating),
                  games: integer(mine[name].games), otherGames: integer(theirs[name].games) });
  }

  const anchors = el('div', { class: 'card' },
    el('h2', {}, 'What the two runs share', el('small', { text: data.run + ' against ' + other.run })),
    el('div', { class: 'note' }, 'A fixed player both runs field is the bridge between their tier lists: the scripted '
      + 'fighter is held at 1500 in both, and a published network is rated by each on its own fights. Two ratings within '
      + 'a tier of each other mean the lists can be read together; a gap means one run has met it far too seldom, or the '
      + 'two are measuring different things.'),
    el('div', { class: 'scroll' }, el('table', {},
      el('thead', {}, el('tr', {}, el('th', { class: 'left flat', text: 'player' }),
        el('th', { class: 'flat num', text: data.run }), el('th', { class: 'flat num', text: 'rated' }),
        el('th', { class: 'flat num', text: other.run }), el('th', { class: 'flat num', text: 'rated' }),
        el('th', { class: 'flat num', text: 'apart' }))),
      el('tbody', {}, shared.length ? shared.map((one) => el('tr', {},
        el('td', {}, one.player, ' ', el('span', { class: 'kind ' + one.kind, text: one.kind })),
        el('td', { class: 'num', text: fixed(one.one, 0) }),
        el('td', { class: 'num dim', text: one.games }),
        el('td', { class: 'num', text: fixed(one.two, 0) }),
        el('td', { class: 'num dim', text: one.otherGames }),
        el('td', { class: 'num ' + (Math.abs(one.one - one.two) > 150 ? 'loss' : 'dim'),
                   text: fixed(Math.abs(one.one - one.two), 0) })))
        : [el('tr', {}, el('td', { colspan: 6, class: 'faint',
            text: 'Only the scripted fighter so far. Field the same published network in both runs '
                  + '(scripts\\train.ps1 -LeagueModels vs-copy) and it becomes a second bridge.' }))]))));

  const curves = el('div', { class: 'card' },
    el('h2', {}, 'Rating over the checkpoints'),
    ratingCurve([curveOf(data, 'var(--cyan)'), curveOf(other, 'var(--violet)')]),
    el('div', { class: 'legend' },
      el('span', {}, el('i', { style: 'background: var(--cyan)' }), data.run),
      el('span', {}, el('i', { style: 'background: var(--violet)' }), other.run)));

  return el('div', { style: 'display:grid; gap:14px' }, curves, anchors,
    el('div', { class: 'side-by-side' },
      el('div', { class: 'card' }, el('h2', {}, data.run, el('small', { text: 'tier list' })), tierList(data, { key: '-one' })),
      el('div', { class: 'card' }, el('h2', {}, other.run, el('small', { text: 'tier list' })),
        tierList(other, { key: '-two' }))));
}

// ---------------------------------------------------------------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------------------------------------------------------------

function header() {
  const runs = $('run'), vs = $('vs');
  runs.textContent = '';
  vs.textContent = '';
  for (const run of state.runs) {
    runs.append(el('option', { value: run.name, selected: run.name === state.run, text: run.name }));
  }
  vs.append(el('option', { value: '', selected: !state.vs, text: 'beside: nothing' }));
  for (const run of state.runs) {
    if (run.name === state.run) continue;
    vs.append(el('option', { value: run.name, selected: run.name === state.vs, text: 'beside: ' + run.name }));
  }

  const here = state.runs.find((run) => run.name === state.run);
  const data = state.data;
  $('summary').textContent = !here ? 'no league yet'
    : here.rated.toLocaleString() + ' rated fights · ' + here.players + ' players · ' + here.checkpoints
      + ' checkpoints rated' + (here.models.length ? ' · models ' + here.models.join(', ') : '')
      + (data ? ' · ' + (data.fights.overall.train.fights + data.fights.overall.eval.fights).toLocaleString()
                + ' fights recorded' : '');

  const live = $('live');
  live.className = 'live ' + (state.failed ? 'off' : 'on');
  live.textContent = state.failed ? 'not served' : 'live';
  live.title = state.failed ? (state.message || '') : 'Every ' + POLL_MS / 1000 + ' seconds';

  const tabs = $('tabs');
  tabs.textContent = '';
  for (const [name, title] of TABS) {
    tabs.append(el('button', {
      class: state.tab === name ? 'on' : null, text: title,
      onclick: () => { state.tab = name; writeAddress(); draw(); },
    }));
  }
}

function overall(data) {
  const train = data.fights.overall.train, evaluated = data.fights.overall.eval;
  const both = {};
  for (const key of ['fights', 'wins', 'losses', 'timeouts', 'draws', 'ticks', 'swaps', 'uses', 'shots', 'shot_fights']) {
    both[key] = train[key] + evaluated[key];
  }
  const weapons = { ...train.weapons };
  for (const [name, count] of Object.entries(evaluated.weapons)) weapons[name] = (weapons[name] || 0) + count;
  const causes = { ...train.causes };
  for (const [name, count] of Object.entries(evaluated.causes)) causes[name] = (causes[name] || 0) + count;

  return el('div', { class: 'side-by-side' },
    el('div', { class: 'card' }, el('h2', {}, 'Every fight of the run',
        el('small', { text: both.fights.toLocaleString() + ' recorded in league/results' })),
      el('div', { class: 'pad' },
        el('div', {}, el('b', { text: percent(both.wins, both.fights) }), ' won, ',
          el('span', { class: 'loss', text: percent(both.losses, both.fights) }), ' lost, ',
          el('span', { class: 'timeout', text: percent(both.timeouts, both.fights) }), ' timed out, ',
          el('span', { class: 'dim', text: percent(both.draws, both.fights) }), ' drawn'),
        el('div', { class: 'dim', style: 'margin-top:6px',
          text: both.fights ? Math.round(both.ticks / both.fights) + ' ticks a fight; '
            + (both.swaps / both.fights).toFixed(1) + ' swaps, ' + (both.uses / both.fights).toFixed(1) + ' uses and '
            + (both.shots / both.fights).toFixed(1) + ' shots a fight, firing at all in '
            + percent(both.shot_fights, both.fights) + ' of them' : '' }),
        el('div', { style: 'margin-top:8px' }, el('b', { text: 'Most held: ' }), mostOf(weapons, both.fights)))),
    el('div', { class: 'card' }, el('h2', {}, 'What the agent died of'),
      el('div', { class: 'note', text: 'Of the fights it lost by dying. Anything but "opponent" is a death it could have '
        + 'walked away from.' }),
      el('div', { class: 'scroll' }, breakdown(causes, both.losses))));
}

function draw() {
  header();
  const main = $('main');
  main.textContent = '';

  if (state.failed && !state.data) {
    main.append(el('div', { class: 'card' }, el('div', { class: 'empty' },
      el('div', { html: '<b>The league page needs the viewer serving it.</b>' }),
      el('div', { style: 'margin-top:8px', html: 'Start it with <code>scripts\\viewer.ps1 -League</code>. '
        + 'It reads only what a run already writes.' }),
      el('div', { class: 'faint', style: 'margin-top:8px', text: state.message || '' }))));
    return;
  }

  if (!state.runs.length) {
    main.append(el('div', { class: 'card' }, el('div', { class: 'empty' },
      el('div', { html: '<b>No run has a league yet.</b>' }),
      el('div', { style: 'margin-top:8px',
        html: 'Start one with <code>scripts\\train.ps1 -Run league -Suite league -Seed vs-copy</code>, '
          + 'and this lists it as soon as the trainer has rated a fight.' }))));
    return;
  }

  const data = state.data;
  if (!data) return;

  if (state.tab === 'tiers') {
    main.append(el('div', { class: 'card' },
      el('h2', {}, 'Rating over the checkpoints', el('small', { text: data.run })),
      ratingCurve([curveOf(data, 'var(--cyan)')])));
    main.append(el('div', { class: 'card' },
      el('h2', {}, 'Tier list', el('small', { text: 'the newest rated checkpoints, the best of them, and every other player' })),
      el('div', { class: 'note' }, 'Elo from evaluation fights only: a checkpoint on its most likely action against an '
        + 'opponent drawn evenly from everyone. The scripted fighter is held at 1500, so the scale means the same in every '
        + 'run; a tier is 150 points. Won, lost and drawn are the player’s own, not the agent’s.'),
      recordingNote(data),
      tierList(data, {})));
    main.append(overall(data));
  } else if (state.tab === 'opponents') {
    main.append(el('div', { class: 'card' },
      el('h2', {}, 'Against each opponent', el('small', { text: 'eval and train are the last 200 fights of each kind' })),
      el('div', { class: 'note' }, 'A mob, a squad of several at once (2x_zombie), a rung of the difficulty ladder '
        + '(zombie(hard)), the scripted fighter, or a published network the run fields. Every one is a player in its own '
        + 'right: two zombies are not twice a zombie, and nothing here adds any of them up.'),
      recordingNote(data),
      opponentTable(data)));
  } else if (state.tab === 'loadouts') {
    main.append(el('div', { class: 'card' },
      el('h2', {}, 'With each loadout the agent carried'), recordingNote(data), loadoutTable(data)));
    main.append(el('div', { class: 'card' },
      el('h2', {}, 'On each kind of ground, and what finished the other side'),
      el('div', { class: 'note' }, 'A quarter of the fights are drawn onto ground with something on it worth knocking an '
        + 'opponent into. The ground column is the number to watch: a fight the terrain ends is the agent’s win either '
        + 'way, so it is the only sign that the agent has learned the terrain is a weapon.'),
      recordingNote(data),
      groundTable(data)));
  } else if (state.tab === 'models') {
    main.append(el('div', { class: 'card' },
      el('h2', {}, 'Every evaluated model', el('small', { text: 'from the per-fight records; pick one for its own tables' })),
      el('div', { class: 'note' }, 'A model is a checkpoint that was evaluated: its fights are the ones played on its most '
        + 'likely action, and the ones the trainer rates. Swaps, uses and shots are what the body actually did, not what '
        + 'the network asked for.'),
      recordingNote(data),
      modelTable(data)));
    main.append(modelDetail(data));
  } else if (state.tab === 'matrix') {
    main.append(el('div', { class: 'card' },
      el('h2', {}, 'Every pairing of an opponent and a loadout', el('small', { text: 'every fight of the run' })),
      el('div', { class: 'note' }, 'Green is above half, red below; a dot is a pairing that has not come up. What '
        + 'matchmaking draws is the pairing — the loadout and the opponent together — and it sends the fights where the '
        + 'agent wins about half of them, so the counts are uneven by design. Only evaluation fights still draw both '
        + 'evenly, since every rating in the league is measured on those. Hover a cell for what is behind it, or click '
        + 'it to watch a fight of that pairing.'),
      matrixControls(data),
      matrix(data)));
  } else if (state.tab === 'compare') {
    main.append(compare(data, state.other));
  }
}

// ---------------------------------------------------------------------------------------------------------------------
// Going
// ---------------------------------------------------------------------------------------------------------------------

$('run').addEventListener('change', (event) => {
  state.run = event.target.value;
  state.model = null;
  if (state.vs === state.run) state.vs = '';
  writeAddress();
  refresh(false);
});

$('vs').addEventListener('change', (event) => {
  state.vs = event.target.value;
  if (state.vs) state.tab = 'compare';
  writeAddress();
  refresh(false);
});

readAddress();
refresh(true).then(() => writeAddress());

setInterval(() => { if (!document.hidden) refresh(true); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
</script>
</body>
</html>
